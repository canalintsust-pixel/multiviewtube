<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE IMERSIVO
========================= */

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   STAGE 16:9 CENTRAL
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-width:calc(100vh * 16 / 9);
    max-height:100vh;

    display:grid;
    gap:2px;
    background:black;
}

/* TILE */
.tile {
    width:100%;
    height:100%;
    background:#000;
}

/* iframe */
iframe {
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   OVERLAY
========================= */

#overlay {
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;

    display:flex;
    gap:6px;

    opacity:0;
    transition:0.2s;
    pointer-events:none;
}

#overlay.show {
    opacity:1;
    pointer-events:auto;
}

button {
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* =========================
   MODAL
========================= */

#modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

#modalBox {
    background:#111;
    padding:15px;
    border-radius:10px;
    width:85%;
    max-width:320px;
    color:white;
}

.list button {
    width:100%;
    margin:3px 0;
    padding:8px;
    background:#222;
    border:1px solid #333;
}

.list button.active {
    background:#ff0000;
}

input {
    width:100%;
    padding:8px;
    margin-top:10px;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <button onclick="openSwap()">TROCAR</button>
    <button onclick="openReplace()">SUBSTITUIR</button>
</div>

<!-- MODAL -->
<div id="modal">
    <div id="modalBox"></div>
</div>

<!-- GRID -->
<div id="stage"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

/* =========================
   YOUTUBE ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   OVERLAY AUTO HIDE
========================= */

let timer;

function showOverlay(){
    let o = document.getElementById("overlay");
    o.classList.add("show");

    clearTimeout(timer);
    timer = setTimeout(()=>{
        o.classList.remove("show");
    }, 2500);
}

document.body.addEventListener("touchstart", showOverlay);

/* =========================
   GRID
========================= */

function layout(n){

    let stage = document.getElementById("stage");

    let cols = (n <= 2) ? 2 : (n <= 4 ? 2 : 3);
    let rows = (n <= 2) ? 1 : 2;

    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* =========================
   RENDER
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);

    layout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        `;

        stage.appendChild(tile);
    }
}

/* =========================
   SWAP (A/B)
========================= */

let swapA = null;
let swapB = null;

function openSwap(){

    let modal = document.getElementById("modal");
    let box = document.getElementById("modalBox");

    swapA = null;
    swapB = null;

    box.innerHTML = `<h3>Trocar posição</h3>`;

    let list = `<div class="list">`;

    videos.forEach((v,i)=>{
        list += `<button onclick="selectSwap(${i})">Live ${i+1}</button>`;
    });

    list += `</div>
    <button onclick="confirmSwap()">OK TROCAR</button>`;

    box.innerHTML += list;

    modal.style.display = "flex";
}

function selectSwap(i){

    if(swapA === null){
        swapA = i;
    } else {
        swapB = i;
    }
}

function confirmSwap(){

    if(swapA === null || swapB === null) return;

    let tmp = videos[swapA];
    videos[swapA] = videos[swapB];
    videos[swapB] = tmp;

    localStorage.setItem("videos", JSON.stringify(videos));

    closeModal();
    load();
}

/* =========================
   REPLACE
========================= */

let replaceIndex = null;

function openReplace(){

    let modal = document.getElementById("modal");
    let box = document.getElementById("modalBox");

    box.innerHTML = `<h3>Substituir live</h3>`;

    videos.forEach((v,i)=>{
        box.innerHTML += `<button onclick="pickReplace(${i})">Live ${i+1}</button>`;
    });

    modal.style.display = "flex";
}

function pickReplace(i){

    replaceIndex = i;

    let url = prompt("Cole nova live:");

    if(!url) return;

    videos[i] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    closeModal();
    load();
}

/* =========================
   MODAL
========================= */

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

/* =========================
   START
========================= */

load();
showOverlay();

</script>

</body>
</html>

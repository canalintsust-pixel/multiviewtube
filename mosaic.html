<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mosaic Live</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CANVAS 16:9 FIXO */
    #canvas {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      display: grid;
      background: black;
    }

    .cell {
      position: relative;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #aaa;
      font-family: Arial;
      font-size: 12px;
      z-index: 10;
    }

    /* OVERLAY */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #overlayPanel {
      display: flex;
      gap: 10px;
      background: rgba(20,20,20,0.95);
      padding: 14px;
      border-radius: 10px;
    }

    #overlayPanel button {
      background: #222;
      color: white;
      border: 1px solid #333;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="status">Carregando lives...</div>

<div id="overlay">
  <div id="overlayPanel">
    <button onclick="alert('TROCAR (Passo 8)')">TROCAR</button>
    <button onclick="alert('SUBSTITUIR (Passo 8)')">SUBSTITUIR</button>
    <button onclick="alert('LAYOUT (Passo 8)')">LAYOUT</button>
    <button onclick="forceReload()">ATUALIZAR TODAS</button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const overlayEl = document.getElementById("overlay");

const selected = JSON.parse(localStorage.getItem("selectedChannels") || "[]");
const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev/";

let currentState = {};
let overlayTimer = null;

/* -------------------------
   INIT SAFE (WebView)
-------------------------- */
window.addEventListener("DOMContentLoaded", () => {
  overlayEl.style.display = "none";
});

/* -------------------------
   GRID
-------------------------- */
function setGrid(cols, rows) {
  canvas.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  canvas.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* -------------------------
   EMBED YOUTUBE
-------------------------- */
function buildEmbed(videoId) {
  return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

/* -------------------------
   CELLS
-------------------------- */
function createCell(channel, videoId) {
  const wrapper = document.createElement("div");
  wrapper.className = "cell";
  wrapper.dataset.channel = channel;

  const iframe = document.createElement("iframe");
  iframe.src = buildEmbed(videoId);
  iframe.allow = "autoplay; encrypted-media";
  iframe.allowFullscreen = true;

  wrapper.appendChild(iframe);
  return wrapper;
}

function updateCell(cell, videoId) {
  const iframe = cell.querySelector("iframe");
  if (iframe) iframe.src = buildEmbed(videoId);
}

/* -------------------------
   LAYOUT
-------------------------- */
function applyLayout(n) {
  if (n === 1) setGrid(1,1);
  else if (n === 2) setGrid(2,1);
  else if (n <= 4) setGrid(2,2);
  else setGrid(3,2);
}

/* -------------------------
   RENDER ROBUSTO
-------------------------- */
function render(data) {
  const channels = Object.keys(data);

  applyLayout(channels.length);

  // reset se mudou estrutura
  if (canvas.children.length !== channels.length) {
    canvas.innerHTML = "";
    currentState = {};
  }

  channels.forEach(ch => {
    const vid = data[ch];
    const oldVid = currentState[ch];

    let cell = canvas.querySelector(`[data-channel="${ch}"]`);

    if (!cell) {
      cell = createCell(ch, vid);
      canvas.appendChild(cell);
    }

    if (vid && vid !== oldVid) {
      updateCell(cell, vid);
    }

    currentState[ch] = vid;
  });
}

/* -------------------------
   LOAD WORKER
-------------------------- */
async function load() {
  try {
    status.textContent = "Atualizando...";

    const res = await fetch(`${WORKER_URL}?channels=${selected.join(",")}`);
    const data = await res.json();

    render(data);

    status.textContent = "OK - ao vivo";

  } catch (e) {
    console.error(e);
    status.textContent = "Erro no Worker";
  }
}

/* -------------------------
   FORCE RELOAD
-------------------------- */
function forceReload() {
  currentState = {};
  load();
}

/* -------------------------
   OVERLAY CONTROL
-------------------------- */
function showOverlay() {
  overlayEl.style.display = "flex";

  clearTimeout(overlayTimer);

  overlayTimer = setTimeout(() => {
    hideOverlay();
  }, 2500);
}

function hideOverlay() {
  overlayEl.style.display = "none";
}

/* -------------------------
   INPUT (WEBVIEW SAFE)
-------------------------- */
document.addEventListener("pointerdown", (e) => {
  const visible = overlayEl.style.display === "flex";

  if (e.target.closest("#overlayPanel")) return;

  const path = e.composedPath ? e.composedPath() : [];
  if (path.some(el => el && el.tagName === "IFRAME")) return;

  if (e.target.closest("#canvas") && !visible) {
    showOverlay();
  }
});

/* -------------------------
   AUTO UPDATE
-------------------------- */
load();
setInterval(load, 60000);
</script>

</body>
</html>

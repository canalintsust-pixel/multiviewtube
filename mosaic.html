<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mosaic Live</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Canvas 16:9 fixo */
    #canvas {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      display: grid;
      background: black;
    }

    .cell {
      position: relative;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #aaa;
      font-family: Arial;
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="status">Carregando lives...</div>

<script>
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

const selected = JSON.parse(localStorage.getItem("selectedChannels") || "[]");

// 👉 SEU WORKER AQUI
const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev/";

let liveData = {};

/* -------------------------
   GRID ENGINE (mesmo do passo 3)
-------------------------- */

function setGrid(cols, rows) {
  canvas.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  canvas.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

function clear() {
  canvas.innerHTML = "";
}

function cell(content) {
  const div = document.createElement("div");
  div.className = "cell";
  div.appendChild(content);
  return div;
}

/* -------------------------
   YOUTUBE EMBED
-------------------------- */

function createIframe(videoId) {
  const iframe = document.createElement("iframe");
  iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=0`;
  iframe.allow = "autoplay; encrypted-media";
  iframe.allowFullscreen = true;
  return iframe;
}

/* -------------------------
   LAYOUT ENGINE SIMPLES
-------------------------- */

function renderLayout(videos) {
  clear();

  const keys = Object.keys(videos);
  const n = keys.length;

  if (n === 0) {
    status.textContent = "Nenhuma live ativa";
    return;
  }

  status.textContent = "Lives ativas: " + n;

  // 1
  if (n === 1) setGrid(1, 1);

  // 2
  else if (n === 2) setGrid(2, 1);

  // 3
  else if (n === 3) setGrid(2, 2);

  // 4
  else if (n === 4) setGrid(2, 2);

  // 5
  else if (n === 5) setGrid(3, 2);

  // 6
  else setGrid(3, 2);

  keys.slice(0, 6).forEach((ch) => {
    const videoId = videos[ch];

    const iframe = videoId
      ? createIframe(videoId)
      : (() => {
          const div = document.createElement("div");
          div.style.color = "#666";
          div.style.display = "flex";
          div.style.alignItems = "center";
          div.style.justifyContent = "center";
          div.style.height = "100%";
          div.innerText = "Offline";
          return div;
        })();

    canvas.appendChild(cell(iframe));
  });
}

/* -------------------------
   FETCH WORKER
-------------------------- */

async function loadLives() {
  try {
    status.textContent = "Atualizando lives...";

    const res = await fetch(
      `${WORKER_URL}?channels=${selected.join(",")}`
    );

    const data = await res.json();
    liveData = data;

    renderLayout(liveData);

  } catch (e) {
    status.textContent = "Erro ao carregar Worker";
    console.error(e);
  }
}

/* -------------------------
   INIT
-------------------------- */

loadLives();

/* auto refresh (base do sistema futuro) */
setInterval(loadLives, 60000);
</script>

</body>
</html>

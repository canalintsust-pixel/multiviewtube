<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE IMERSIVO TOTAL
========================= */

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   STAGE 16:9 FIXO
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);
    max-height:100vh;
    max-width:calc(100vh * 16 / 9);

    display:grid;
    gap:2px;
    background:black;
}

/* =========================
   TILE
========================= */

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    border-radius:6px;
}

.tile.selected {
    outline:2px solid red;
}

/* iframe */
iframe {
    position:absolute;
    width:100%;
    height:100%;
    border:none;
}

/* OFFLINE */
.offline {
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,0.85);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    flex-direction:column;
    z-index:5;
}

/* =========================
   OVERLAY INTELIGENTE
========================= */

#overlay {
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;

    display:flex;
    gap:6px;

    opacity:0;
    transition:0.25s;
    pointer-events:none;
}

#overlay.show {
    opacity:1;
    pointer-events:auto;
}

button {
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* =========================
   MODAL
========================= */

#modal {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

#modalContent {
    background:#111;
    padding:15px;
    border-radius:10px;
    width:80%;
}

#modal textarea {
    width:100%;
    height:80px;
}

/* FULLSCREEN CLEAN */
.fullscreen #overlay {
    opacity:0 !important;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <button onclick="toggleFS()">TELA CHEIA</button>
    <button onclick="openReplace()">SUBSTITUIR</button>
    <button onclick="swapMode()">TROCAR POSIÇÃO</button>
</div>

<!-- MODAL -->
<div id="modal">
    <div id="modalContent">
        <textarea id="newUrl" placeholder="Cole nova live..."></textarea>
        <br><br>
        <button onclick="confirmReplace()">OK</button>
        <button onclick="closeModal()">CANCELAR</button>
    </div>
</div>

<!-- STAGE -->
<div id="stage"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let selected = null;
let swapFirst = null;
let swapModeEnabled = false;

/* =========================
   EXTRAI ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT
========================= */

function layout(n){
    let cols = (n <= 2) ? 2 : (n <= 4 ? 2 : 3);
    let rows = (n <= 2) ? 1 : 2;

    let stage = document.getElementById("stage");
    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* =========================
   RENDER SEM RELOAD TOTAL
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);

    layout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = i;

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>

            <div class="offline" style="display:none;">LIVE OFFLINE</div>
        `;

        /* CLICK SELECT */
        tile.onclick = () => handleSelect(i, tile);

        /* DRAG */
        tile.draggable = true;

        tile.ondragstart = () => swapFirst = i;

        tile.ondragover = e => e.preventDefault();

        tile.ondrop = e => {
            e.preventDefault();
            if(swapFirst === null) return;

            swap(swapFirst, i);
            swapFirst = null;
        };

        stage.appendChild(tile);

        monitorLive(tile, i);
    }
}

/* =========================
   SELECT TILE
========================= */

function handleSelect(i, tile){

    selected = i;

    document.querySelectorAll(".tile").forEach(t => t.classList.remove("selected"));
    tile.classList.add("selected");

    showOverlay();
}

/* =========================
   SWAP POSIÇÃO SEM RELOAD
========================= */

function swap(a,b){

    let tmp = videos[a];
    videos[a] = videos[b];
    videos[b] = tmp;

    localStorage.setItem("videos", JSON.stringify(videos));

    load();
}

/* =========================
   SUBSTITUIR LIVE
========================= */

function openReplace(){
    if(selected === null) return;
    document.getElementById("modal").style.display = "flex";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

function confirmReplace(){

    let url = document.getElementById("newUrl").value;

    if(!url || selected === null) return;

    videos[selected] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    closeModal();
    load();
}

/* =========================
   DETECT LIVE OFFLINE
========================= */

function monitorLive(tile, i){

    let iframe = tile.querySelector("iframe");
    let offline = tile.querySelector(".offline");

    setTimeout(() => {

        try {
            if(!iframe.contentWindow){
                offline.style.display = "flex";
            }
        } catch(e){
            offline.style.display = "flex";
        }

    }, 12000);
}

/* =========================
   OVERLAY INTELIGENTE
========================= */

let overlayTimer;

function showOverlay(){

    let overlay = document.getElementById("overlay");

    overlay.classList.add("show");

    clearTimeout(overlayTimer);

    overlayTimer = setTimeout(() => {
        overlay.classList.remove("show");
    }, 2500);
}

document.body.addEventListener("touchstart", showOverlay);
document.body.addEventListener("click", showOverlay);

/* =========================
   FULLSCREEN IMERSIVO
========================= */

function toggleFS(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");

    } else {

        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   SWAP MODE (FUTURO EXPAND)
========================= */

function swapMode(){
    swapModeEnabled = !swapModeEnabled;
    alert("Drag ativado (arraste para trocar posições)");
}

/* INIT */
load();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
}

.topbar{
    display:flex;
    justify-content:space-between;
    padding:10px;
    background:#111;
    position:sticky;
    top:0;
    z-index:10;
}

button{
    border:none;
    padding:8px 12px;
    border-radius:6px;
    background:#ff0000;
    color:white;
}

#grid{
    display:grid;
    gap:5px;
    padding:5px;
}

.tile{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #222;
    cursor:grab;
}

.tile.dragging{
    opacity:0.5;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div class="topbar">
<button onclick="toggleFS()">FULLSCREEN</button>
<button onclick="reset()">RESET</button>
</div>

<div id="grid"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let dragIndex = null;

function extractID(url){
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

function getCols(n){
    if(n <= 1) return 1;
    if(n == 2) return 2;
    if(n <= 4) return 2;
    return 3;
}

function layout(cols){
    document.getElementById("grid")
        .style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
}

function load(){

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    let n = Math.min(videos.length, 6);
    layout(getCols(n));

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);

        let div = document.createElement("div");
        div.className = "tile";
        div.draggable = true;
        div.dataset.index = i;

        div.innerHTML = `
            <iframe src="https://www.youtube.com/embed/${id}"
            allow="autoplay; encrypted-media"
            allowfullscreen></iframe>
        `;

        // DRAG START
        div.addEventListener("dragstart", e=>{
            dragIndex = i;
            div.classList.add("dragging");
        });

        div.addEventListener("dragend", e=>{
            div.classList.remove("dragging");
        });

        div.addEventListener("dragover", e=>{
            e.preventDefault();
        });

        // DROP (troca posição)
        div.addEventListener("drop", e=>{
            e.preventDefault();

            let targetIndex = i;

            let temp = videos[dragIndex];
            videos[dragIndex] = videos[targetIndex];
            videos[targetIndex] = temp;

            localStorage.setItem("videos", JSON.stringify(videos));

            load();
        });

        grid.appendChild(div);
    }

    // detectar vídeos quebrados (simples fallback)
    setTimeout(checkVideos, 5000);
}

function checkVideos(){

    let iframes = document.querySelectorAll("iframe");

    iframes.forEach((frame, i)=>{

        frame.onerror = ()=>{
            replaceVideo(i);
        };

        // fallback visual simples
        try{
            if(!frame.contentWindow){
                replaceVideo(i);
            }
        }catch(e){
            replaceVideo(i);
        }

    });
}

function replaceVideo(index){

    let newUrl = prompt("Live caiu. Cole nova URL:");

    if(newUrl){

        videos[index] = newUrl;
        localStorage.setItem("videos", JSON.stringify(videos));
        load();
    }
}

function toggleFS(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
    }else{
        document.exitFullscreen();
    }
}

function reset(){
    localStorage.removeItem("videos");
    window.location.href = "index.html";
}

load();

</script>

</body>
</html>

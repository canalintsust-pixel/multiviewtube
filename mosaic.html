<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mosaic Live</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: black;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#canvas {
  position: relative;
  width: 100vw;
  height: 56.25vw;
  max-height: 100vh;
  max-width: 177.78vh;
  display: grid;
  background: black;
}

.cell {
  position: relative;
  overflow: hidden;
  background: black;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* ---------------- OVERLAY ---------------- */

#overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  z-index: 999;
}

.btn {
  padding: 12px 18px;
  background: #222;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
  font-family: Arial;
  cursor: pointer;
  min-width: 180px;
  text-align: center;
}

.btn:hover {
  background: #333;
}

#status {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #aaa;
  font-family: Arial;
  font-size: 12px;
  z-index: 10;
}

/* ================= MODAIS ================= */

.modal {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1500;
}

.modalBox {
  background: #111;
  padding: 20px;
  border-radius: 10px;
  width: 320px;
  color: white;
  font-family: Arial;
}

.modalHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.modalHeader button {
  background: transparent;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 18px;
}

#swapList div,
#replaceList div {
  padding: 8px;
  margin: 4px 0;
  background: #222;
  border-radius: 5px;
  cursor: pointer;
}

#swapList div.selected,
#replaceList div.selected {
  outline: 2px solid lime;
}
</style>
</head>

<body>

<div id="canvas"></div>
<div id="status">Carregando...</div>

<div id="overlay">
  <div class="btn" onclick="openSwapModal()">TROCAR</div>
  <div class="btn" onclick="openReplaceModal()">SUBSTITUIR</div>
  <div class="btn" onclick="cycleLayout()">LAYOUT</div>
  <div class="btn" onclick="forceUpdate()">ATUALIZAR TODAS</div>
</div>

<!-- SWAP -->

<div id="swapModal" class="modal">
  <div class="modalBox">

    <div class="modalHeader">
      <span>TROCAR POSIÇÕES</span>
      <button onclick="closeSwapModal()">✕</button>
    </div>

    <div id="swapList"></div>

    <button onclick="confirmSwap()">
      TROCAR POSIÇÃO
    </button>

  </div>
</div>

<!-- REPLACE -->

<div id="replaceModal" class="modal">
  <div class="modalBox">

    <div class="modalHeader">
      <span>SUBSTITUIR LIVE</span>
      <button onclick="closeReplaceModal()">✕</button>
    </div>

    <div id="replaceList"></div>

    <input
      id="newUrl"
      placeholder="Cole nova URL"
      style="width:100%;margin-top:10px;"
    >

    <button
      onclick="confirmReplace()"
      style="margin-top:10px;"
    >
      SUBSTITUIR
    </button>

  </div>
</div>

<script>

const canvas = document.getElementById("canvas");
const overlay = document.getElementById("overlay");
const status = document.getElementById("status");

const swapModal = document.getElementById("swapModal");
const replaceModal = document.getElementById("replaceModal");

const WORKER_URL =
"https://polished-smoke-6d50.canalintsust.workers.dev/";

const selected =
JSON.parse(localStorage.getItem("selectedChannels") || "[]");

let state = [];
let selectedCells = [];
let swapSelection = [];
let replaceIndex = null;

let mode = null;
let overlayTimer = null;

/* ---------------- GRID ---------------- */

function setGrid(c, r) {
  canvas.style.gridTemplateColumns = `repeat(${c},1fr)`;
  canvas.style.gridTemplateRows = `repeat(${r},1fr)`;
}

/* ---------------- EMBED ---------------- */

function buildEmbed(id) {
  return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

/* ---------------- CELL ---------------- */

function createCell(item, index) {

  const div = document.createElement("div");

  div.className = "cell";
  div.dataset.index = index;

  const iframe = document.createElement("iframe");
  iframe.src = buildEmbed(item.videoId);

  div.appendChild(iframe);

  return div;
}

function updateCell(index, videoId) {

  const cell =
  canvas.querySelector(`[data-index="${index}"]`);

  if (!cell) return;

  cell.querySelector("iframe").src =
  buildEmbed(videoId);
}

/* ---------------- LAYOUT ---------------- */

function applyLayout(n) {

  if (n === 1) setGrid(1,1);
  else if (n === 2) setGrid(2,1);
  else if (n <= 4) setGrid(2,2);
  else setGrid(3,2);
}

/* ---------------- RENDER ---------------- */

function render() {

  canvas.innerHTML = "";

  applyLayout(state.length);

  state.forEach((item, i) => {
    canvas.appendChild(createCell(item, i));
  });
}

/* ================= MODAIS ================= */

function openSwapModal() {

  overlay.style.display = "none";

  mode = "swap";

  selectedCells = [];
  swapSelection = [];

  swapModal.style.display = "flex";

  const list =
  document.getElementById("swapList");

  list.innerHTML = "";

  state.forEach((item, i) => {

    const div = document.createElement("div");

    div.textContent = item.channel;

    div.onclick = () => {

      if (swapSelection.includes(i)) {

        swapSelection =
        swapSelection.filter(x => x !== i);

        div.classList.remove("selected");

      } else {

        if (swapSelection.length >= 2)
          return;

        swapSelection.push(i);

        div.classList.add("selected");
      }
    };

    list.appendChild(div);
  });
}

function closeSwapModal() {

  swapModal.style.display = "none";

  swapSelection = [];
  selectedCells = [];

  mode = null;
}
function confirmSwap() {

  if (swapSelection.length !== 2) {
    alert("Selecione exatamente 2 canais");
    return;
  }

  const [a, b] = swapSelection;

  const temp = state[a];
  state[a] = state[b];
  state[b] = temp;

  saveState();
  render();

  closeSwapModal();
}

/* ================= REPLACE ================= */

function openReplaceModal() {

  overlay.style.display = "none";

  mode = "replace";

  selectedCells = [];
  replaceIndex = null;

  replaceModal.style.display = "flex";

  const list =
  document.getElementById("replaceList");

  list.innerHTML = "";

  state.forEach((item, i) => {

    const div = document.createElement("div");

    div.textContent = item.channel;

    div.onclick = () => {

      replaceIndex = i;

      [...list.children]
      .forEach(x =>
        x.classList.remove("selected")
      );

      div.classList.add("selected");
    };

    list.appendChild(div);
  });
}

function closeReplaceModal() {

  replaceModal.style.display = "none";

  replaceIndex = null;
  selectedCells = [];

  document.getElementById("newUrl").value = "";

  mode = null;
}

function confirmReplace() {

  const url =
  document.getElementById("newUrl").value.trim();

  if (replaceIndex === null) {
    alert("Selecione um canal");
    return;
  }

  if (!url) {
    alert("Cole uma URL");
    return;
  }

  const match =
  url.match(/([a-zA-Z0-9_-]{11})/);

  if (!match) {
    alert("Vídeo inválido");
    return;
  }

  state[replaceIndex].videoId =
  match[1];

  saveState();

  updateCell(
    replaceIndex,
    match[1]
  );

  closeReplaceModal();
}

/* ---------------- LAYOUT ---------------- */

let layoutMode = 0;

function cycleLayout() {

  layoutMode =
  (layoutMode + 1) % 3;

  if (layoutMode === 0)
    setGrid(1,1);

  if (layoutMode === 1)
    setGrid(2,2);

  if (layoutMode === 2)
    setGrid(3,2);
}

/* ---------------- UPDATE ALL ---------------- */

async function forceUpdate() {

  try {

    status.textContent =
    "Atualizando...";

    const res =
    await fetch(
      `${WORKER_URL}?channels=${selected.join(",")}`
    );

    const data =
    await res.json();

    state.forEach((item, i) => {

      const newId =
      data[item.channel];

      if (
        newId &&
        newId !== item.videoId
      ) {

        item.videoId = newId;

        updateCell(i, newId);
      }
    });

    saveState();

    status.textContent =
    "AO VIVO";

  } catch (err) {

    console.error(err);

    status.textContent =
    "ERRO";
  }
}

/* ---------------- PERSIST ---------------- */

function saveState() {

  localStorage.setItem(
    "mosaicState",
    JSON.stringify(state)
  );
}

/* ---------------- LOAD ---------------- */

async function init() {

  try {

    const saved =
    localStorage.getItem(
      "mosaicState"
    );

    if (saved) {

      state =
      JSON.parse(saved);

      render();

      status.textContent =
      "AO VIVO";

      return;
    }

    const res =
    await fetch(
      `${WORKER_URL}?channels=${selected.join(",")}`
    );

    const data =
    await res.json();

    state =
    Object.keys(data)
    .map(ch => ({
      channel: ch,
      videoId: data[ch]
    }));

    saveState();

    render();

    status.textContent =
    "AO VIVO";

  } catch (err) {

    console.error(err);

    status.textContent =
    "ERRO";
  }
}

/* ---------------- OVERLAY ---------------- */

function showOverlay() {

  if (
    swapModal.style.display === "flex" ||
    replaceModal.style.display === "flex"
  ) {
    return;
  }

  overlay.style.display = "flex";

  clearTimeout(
    overlayTimer
  );

  overlayTimer =
  setTimeout(() => {

    overlay.style.display =
    "none";

  }, 2500);
}

document.body.addEventListener(
  "click",
  (e) => {

    if (
      e.target.closest(".modal")
    ) {
      return;
    }

    if (
      e.target.closest("iframe")
    ) {
      return;
    }

    if (
      e.target.classList.contains("btn")
    ) {
      return;
    }

    showOverlay();
  }
);

/* ---------------- EXPORTS ---------------- */

window.openSwapModal =
openSwapModal;

window.closeSwapModal =
closeSwapModal;

window.confirmSwap =
confirmSwap;

window.openReplaceModal =
openReplaceModal;

window.closeReplaceModal =
closeReplaceModal;

window.confirmReplace =
confirmReplace;

window.cycleLayout =
cycleLayout;

window.forceUpdate =
forceUpdate;

/* ---------------- START ---------------- */

init();

setInterval(
  forceUpdate,
  60000
);

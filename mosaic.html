<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic V3</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   STAGE 16:9 SAFE
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-width:calc(100vh * 16 / 9);
    max-height:100vh;

    display:grid;
    gap:2px;
    background:black;
}

/* =========================
   TILE
========================= */

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

.tile iframe {
    width:100%;
    height:100%;
    border:none;
}

/* destaque real */
.tile.main {
    border:2px solid #00ff88;
    transform:scale(1.02);
}

/* =========================
   OVERLAY INTELIGENTE
========================= */

#overlay {
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;

    display:flex;
    gap:6px;

    opacity:0;
    transition:0.2s;
    pointer-events:none;
}

#overlay.show {
    opacity:1;
    pointer-events:auto;
}

button {
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

</style>
</head>

<body>

<div id="overlay">
    <button onclick="openSwap()">TROCAR</button>
    <button onclick="openReplace()">SUBSTITUIR</button>
    <button onclick="cycleLayout()">LAYOUT</button>
</div>

<div id="stage"></div>

<script>

/* =========================
   STATE
========================= */

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let layoutMode = 0;
let mainIndex = 0;

/* =========================
   OVERLAY
========================= */

let timer;

function showOverlay(){
    let o = document.getElementById("overlay");
    o.classList.add("show");

    clearTimeout(timer);
    timer = setTimeout(()=>o.classList.remove("show"), 2500);
}

document.body.addEventListener("touchstart", showOverlay);

/* =========================
   YOUTUBE
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT SWITCH
========================= */

function cycleLayout(){
    layoutMode = (layoutMode + 1) % 4;
    load();
}

/* =========================
   AUTO ROTATE (MODE 3)
========================= */

setInterval(()=>{
    if(layoutMode === 3 && videos.length > 1){
        mainIndex = (mainIndex + 1) % videos.length;
        load();
    }
}, 180000);

/* =========================
   APPLY LAYOUT REAL
========================= */

function applyLayout(n){

    let stage = document.getElementById("stage");

    if(layoutMode === 0){
        stage.style.gridTemplateColumns = (n <= 2 ? "2fr 2fr" : "repeat(3, 1fr)");
        stage.style.gridTemplateRows = (n <= 2 ? "1fr" : "repeat(2, 1fr)");
        return;
    }

    if(layoutMode === 1){
        stage.style.gridTemplateColumns = "2fr 1fr";
        stage.style.gridTemplateRows = "repeat(3, 1fr)";
        return;
    }

    if(layoutMode === 2){
        stage.style.gridTemplateColumns = "repeat(2, 1fr)";
        stage.style.gridTemplateRows = "2fr 1fr";
        return;
    }

    if(layoutMode === 3){
        stage.style.gridTemplateColumns = "2fr 1fr";
        stage.style.gridTemplateRows = "repeat(3, 1fr)";
    }
}

/* =========================
   LOAD
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);

    applyLayout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";

        let isMain = (
            layoutMode === 3 ? i === mainIndex :
            layoutMode === 1 ? i === 0 :
            false
        );

        if(isMain) tile.classList.add("main");

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        `;

        stage.appendChild(tile);
    }
}

/* =========================
   INIT
========================= */

load();
showOverlay();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaic</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:#111;
    padding:10px;
    display:flex;
    gap:10px;
    z-index:10;
}

button{
    padding:8px;
    background:#333;
    color:white;
    border:none;
}

#grid{
    display:grid;
    gap:6px;
    padding-top:60px;
}

.tile{
    position:relative;
    background:#222;
    overflow:hidden;
    aspect-ratio:16/9;
    border-radius:8px;
}

.name{
    position:absolute;
    bottom:5px;
    left:5px;
    background:rgba(0,0,0,0.6);
    padding:3px 6px;
    font-size:12px;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="toggleNames()">Ocultar Nomes</button>
<button onclick="fullscreen()">Tela Cheia</button>
</div>

<div id="grid"></div>

<script>

let showNames = true;

function getData(){

    let data = localStorage.getItem("mv_data");
    return data ? JSON.parse(data) : [];

}

function build(){

    let links = getData();

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    let cols = 1;
    if(links.length == 2) cols = 2;
    else if(links.length <= 4) cols = 2;
    else cols = 4;

    grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;

    links.forEach((item,i)=>{

        let id = extract(item.url);

        let div = document.createElement("div");
        div.className = "tile";

        div.innerHTML = `
            <iframe src="https://www.youtube.com/embed/${id}"
            allowfullscreen></iframe>
            <div class="name">${item.name || "LIVE "+(i+1)}</div>
        `;

        grid.appendChild(div);
    });
}

function extract(url){
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : "";
}

function toggleNames(){
    showNames = !showNames;
    document.querySelectorAll(".name")
    .forEach(n=>n.style.display = showNames ? "block" : "none");
}

function fullscreen(){
    document.documentElement.requestFullscreen();
}

build();

</script>

</body>
</html>

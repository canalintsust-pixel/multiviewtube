<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mosaic Fix</title>

<style>

html, body {
    margin:0;
    padding:0;
    background:#000;
    height:100%;
    overflow:hidden;
    font-family:Arial;
}

/* topbar */
.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:45px;
    background:#111;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
    z-index:10;
}

button{
    background:#ff0000;
    color:#fff;
    border:none;
    padding:6px 10px;
    border-radius:6px;
}

/* GRID */
#grid{
    position:absolute;
    top:45px;
    left:0;
    right:0;
    bottom:0;
    display:grid;
    gap:4px;
    padding:4px;
}

/* TILE 16:9 */
.tile{
    position:relative;
    background:#111;
    border-radius:10px;
    overflow:hidden;
}

/* iframe */
iframe{
    width:100%;
    height:100%;
    border:0;
}

/* debug */
.debug{
    color:white;
    padding:20px;
}

</style>
</head>

<body>

<div class="topbar">
<button onclick="toggleFS()">FULLSCREEN</button>
<button onclick="reset()">RESET</button>
</div>

<div id="grid"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

/* =========================
   EXTRAÇÃO MAIS FORTE
========================= */
function extractID(url){

    if(!url) return null;

    let match = url.match(
        /(youtu\.be\/|v=|\/live\/)([a-zA-Z0-9_-]+)/
    );

    return match ? match[2] : null;
}

/* =========================
   LAYOUT SIMPLES E SEGURO
========================= */
function getCols(n){

    if(n <= 1) return 1;
    if(n == 2) return 2;
    if(n <= 4) return 2;
    return 3;
}

/* =========================
   CRIA TILE
========================= */
function createTile(url){

    let id = extractID(url);

    let div = document.createElement("div");
    div.className = "tile";

    if(!id){
        div.innerHTML = "<div style='color:red;padding:10px'>LINK INVÁLIDO</div>";
        return div;
    }

    div.innerHTML = `
        <iframe
            src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0&origin=${location.origin}"
            allow="autoplay; encrypted-media; fullscreen"
            allowfullscreen>
        </iframe>
    `;

    return div;
}

/* =========================
   LOAD PRINCIPAL
========================= */
function load(){

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    // 🔴 DEBUG VISUAL
    if(!videos || videos.length === 0){
        grid.innerHTML = "<div class='debug'>Nenhum vídeo carregado.<br>Volte ao index.html e cole links.</div>";
        return;
    }

    let n = Math.min(videos.length, 6);

    grid.style.gridTemplateColumns =
        `repeat(${getCols(n)}, 1fr)`;

    for(let i=0;i<n;i++){
        grid.appendChild(createTile(videos[i]));
    }
}

/* =========================
   FULLSCREEN
========================= */
function toggleFS(){

    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
    }else{
        document.exitFullscreen();
    }
}

/* =========================
   RESET
========================= */
function reset(){
    localStorage.removeItem("videos");
    window.location.href = "index.html";
}

load();

</script>

</body>
</html>

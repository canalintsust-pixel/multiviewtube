<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mosaic Multiview</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* CENTRALIZAÇÃO DO CANVAS */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CANVAS 16:9 FIXO */
    #canvas {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 invertido */
      background: #000;
      display: grid;
      overflow: hidden;
    }

    /* CÉLULAS DE VÍDEO */
    .cell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* IFAMES (serão usados no passo 4) */
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* OVERLAY BASE (vai ser usado no passo 5) */
    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      background: rgba(0,0,0,0.6);
      z-index: 10;
    }

    /* STATUS (debug leve) */
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #aaa;
      font-size: 12px;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="overlay"></div>
<div id="status">Inicializando...</div>
<script>
/* =========================
   LAYOUT ENGINE CORE
========================= */

const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

/* Define grid base */
function setGrid(cols, rows) {
  canvas.style.display = "grid";
  canvas.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  canvas.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* Limpa canvas */
function clearCanvas() {
  canvas.innerHTML = "";
}

/* Cria célula vazia (placeholder) */
function createCell(label = "") {
  const div = document.createElement("div");
  div.className = "cell";
  div.innerHTML = `
    <div style="
      color:#666;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      font-size:14px;
    ">
      ${label}
    </div>
  `;
  return div;
}

/* =========================
   LAYOUTS PRINCIPAIS
========================= */

function renderLayout(channels) {
  clearCanvas();

  const n = channels.length;

  if (n === 0) {
    status.textContent = "Nenhuma live selecionada";
    return;
  }

  status.textContent = `Renderizando ${n} lives`;

  /* 1 LIVE */
  if (n === 1) {
    setGrid(1, 1);
    canvas.appendChild(createCell("Live 1"));
    return;
  }

  /* 2 LIVES */
  if (n === 2) {
    setGrid(2, 1);
    canvas.appendChild(createCell("Live 1"));
    canvas.appendChild(createCell("Live 2"));
    return;
  }

  /* 3 LIVES (2 em cima + 1 embaixo) */
  if (n === 3) {
    setGrid(2, 2);

    canvas.appendChild(createCell("Live 1"));
    canvas.appendChild(createCell("Live 2"));

    const bottom = document.createElement("div");
    bottom.style.gridColumn = "1 / span 2";
    bottom.appendChild(createCell("Live 3"));

    canvas.appendChild(bottom);
    return;
  }

  /* 4 LIVES (2x2) */
  if (n === 4) {
    setGrid(2, 2);
    for (let i = 1; i <= 4; i++) {
      canvas.appendChild(createCell(`Live ${i}`));
    }
    return;
  }

  /* 5 LIVES (3 em cima + 2 embaixo) */
  if (n === 5) {
    setGrid(3, 2);

    canvas.appendChild(createCell("Live 1"));
    canvas.appendChild(createCell("Live 2"));
    canvas.appendChild(createCell("Live 3"));

    const b1 = document.createElement("div");
    b1.appendChild(createCell("Live 4"));

    const b2 = document.createElement("div");
    b2.appendChild(createCell("Live 5"));

    canvas.appendChild(b1);
    canvas.appendChild(b2);
    return;
  }

  /* 6 LIVES (3x2) */
  if (n === 6) {
    setGrid(3, 2);
    for (let i = 1; i <= 6; i++) {
      canvas.appendChild(createCell(`Live ${i}`));
    }
    return;
  }

  /* FALLBACK */
  setGrid(2, 2);
  channels.slice(0, 4).forEach((_, i) => {
    canvas.appendChild(createCell(`Live ${i + 1}`));
  });
}
</script>
<script>
/* =========================
   CONFIG
========================= */

const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev/";

/* canais selecionados no index.html */
const selectedChannels =
  JSON.parse(localStorage.getItem("selectedChannels") || "[]");

/* estado atual dos vídeos */
let liveState = {};

/* =========================
   FETCH WORKER
========================= */

async function fetchLives() {
  try {
    status.textContent = "Carregando lives...";

    const url = `${WORKER_URL}?channels=${selectedChannels.join(",")}`;

    const res = await fetch(url);
    const data = await res.json();

    return data;

  } catch (err) {
    console.error("Worker error:", err);
    status.textContent = "Erro ao buscar Worker";
    return {};
  }
}

/* =========================
   INIT SYSTEM
========================= */

async function init() {
  const data = await fetchLives();

  liveState = data;

  const channels = Object.keys(liveState);

  /* chama layout engine (Parte 2) */
  renderLayout(channels);

  status.textContent = "Lives carregadas";
}

/* inicializa */
init();
</script>
<script>
/* =========================
   EMBED CONFIG
========================= */

function buildEmbed(videoId) {
  return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

/* =========================
   RENDER MAP (CANAL -> CELL)
========================= */

let cellMap = {}; // { channel: element }
let currentCache = {}; // { channel: videoId }

/* =========================
   CREATE REAL CELL
========================= */

function createVideoCell(channel, videoId) {
  const wrapper = document.createElement("div");
  wrapper.className = "cell";
  wrapper.dataset.channel = channel;

  const iframe = document.createElement("iframe");
  iframe.src = buildEmbed(videoId);
  iframe.allow = "autoplay; encrypted-media";
  iframe.allowFullscreen = true;

  wrapper.appendChild(iframe);

  return wrapper;
}

/* =========================
   INITIAL RENDER (FIRST LOAD)
========================= */

function renderInitial(channels) {
  clearCanvas();

  cellMap = {};

  channels.forEach((channel, index) => {
    const videoId = liveState[channel];

    const cell = createVideoCell(channel, videoId);

    cellMap[channel] = cell;
    currentCache[channel] = videoId;

    canvas.appendChild(cell);
  });
}

/* =========================
   UPDATE SINGLE CELL (NO RELOAD)
========================= */

function updateCell(channel, newVideoId) {
  const cell = cellMap[channel];
  if (!cell) return;

  const iframe = cell.querySelector("iframe");

  if (iframe) {
    iframe.src = buildEmbed(newVideoId);
  }

  currentCache[channel] = newVideoId;
}

/* =========================
   DIFF ENGINE (CORE INTELIGENTE)
========================= */

function applyDiff(newState) {
  Object.keys(newState).forEach(channel => {
    const newId = newState[channel];
    const oldId = currentCache[channel];

    if (!oldId) return;

    if (newId && newId !== oldId) {
      updateCell(channel, newId);
    }
  });
}

/* =========================
   OVERWRITE INIT (HOOK DA PARTE 3)
========================= */

async function initRender() {
  const channels = Object.keys(liveState);

  renderLayout(channels);
  renderInitial(channels);

  status.textContent = "Multiview ativo";
}

/* sobrescreve init da parte 3 */
init = async function () {
  const data = await fetchLives();

  liveState = data;

  await initRender();
};
</script>
<script>
/* =========================
   OVERLAY SYSTEM
========================= */

const overlay = document.getElementById("overlay");

/* cria UI do overlay */
function createOverlayUI() {
  overlay.innerHTML = `
    <div id="overlayMenu" style="
      position:absolute;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:10px;
      background:rgba(20,20,20,0.9);
      padding:10px;
      border-radius:10px;
      z-index:999;
    ">

      <button onclick="openSwap()" style="padding:10px;">TROCAR</button>
      <button onclick="openReplace()" style="padding:10px;">SUBSTITUIR</button>
      <button onclick="openLayout()" style="padding:10px;">LAYOUT</button>
      <button onclick="manualRefresh()" style="padding:10px;">ATUALIZAR</button>

    </div>
  `;
}

/* mostra overlay */
function showOverlay() {
  overlay.style.display = "block";
  createOverlayUI();

  clearTimeout(window.__overlayTimer);

  window.__overlayTimer = setTimeout(() => {
    hideOverlay();
  }, 2500);
}

/* esconde overlay */
function hideOverlay() {
  overlay.style.display = "none";
}

/* toggle */
function toggleOverlay() {
  if (overlay.style.display === "block") {
    hideOverlay();
  } else {
    showOverlay();
  }
}

/* click na tela ativa overlay */
document.addEventListener("click", (e) => {
  toggleOverlay();
});

/* =========================
   ACTION HOOKS (PARTE 6 IMPLEMENTA LOGIC)
========================= */

function openSwap() {
  status.textContent = "Swap (em breve)";
}

function openReplace() {
  status.textContent = "Replace (em breve)";
}

function openLayout() {
  status.textContent = "Layout (em breve)";
}

/* refresh manual chama Worker */
async function manualRefresh() {
  status.textContent = "Atualizando...";

  const data = await fetchLives();
  liveState = data;

  applyDiff(data);

  status.textContent = "Atualizado";
}

/* inicializa overlay */
createOverlayUI();
</script>
<script>
/* =========================
   SWAP SYSTEM (TROCA POSIÇÃO)
========================= */

let swapSelection = [];

/* ativa modo swap */
function openSwap() {
  status.textContent = "Selecione 2 lives para trocar";

  swapSelection = [];

  Object.keys(cellMap).forEach(ch => {
    const el = cellMap[ch];

    el.onclick = () => {
      if (swapSelection.includes(ch)) {
        swapSelection = swapSelection.filter(x => x !== ch);
        el.style.outline = "none";
        return;
      }

      swapSelection.push(ch);
      el.style.outline = "2px solid lime";

      if (swapSelection.length === 2) {
        swapChannels(swapSelection[0], swapSelection[1]);
      }
    };
  });
}

/* executa swap */
function swapChannels(a, b) {
  const temp = currentState[a];
  currentState[a] = currentState[b];
  currentState[b] = temp;

  updateCell(a, currentState[a]);
  updateCell(b, currentState[b]);

  persistState();

  status.textContent = "Swap concluído";

  resetSwap();
}

/* reset swap UI */
function resetSwap() {
  swapSelection = [];

  Object.values(cellMap).forEach(el => {
    el.style.outline = "none";
    el.onclick = null;
  });
}

/* =========================
   REPLACE SYSTEM (SUBSTITUIR STREAM)
========================= */

function openReplace() {
  const channel = prompt("Digite o canal (@exemplo) ou selecione mentalmente:");
  const url = prompt("Cole nova URL do YouTube:");

  if (!channel || !url) return;

  const videoId = extractVideoId(url);

  if (!videoId) {
    alert("URL inválida");
    return;
  }

  currentState[channel] = videoId;

  updateCell(channel, videoId);

  persistState();

  status.textContent = "Stream substituída";
}

/* extrai ID de qualquer URL do YouTube */
function extractVideoId(url) {
  const match =
    url.match(/v=([a-zA-Z0-9_-]{11})/) ||
    url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/) ||
    url.match(/embed\/([a-zA-Z0-9_-]{11})/);

  return match ? match[1] : null;
}

/* =========================
   LAYOUT PLACEHOLDER (FUTURO)
========================= */

function openLayout() {
  status.textContent = "Layout switch (já ativo via engine)";
}

/* =========================
   PERSISTÊNCIA LOCAL
========================= */

function persistState() {
  localStorage.setItem("mosaic_state", JSON.stringify(currentState));
}

/* restaura estado */
function restoreState() {
  const saved = localStorage.getItem("mosaic_state");

  if (!saved) return;

  try {
    currentState = JSON.parse(saved);
  } catch (e) {
    console.error("restore error", e);
  }
}

/* =========================
   AUTO REFRESH OTIMIZADO
========================= */

setInterval(async () => {
  const data = await fetchLives();

  Object.keys(data).forEach(ch => {
    const newId = data[ch];
    const oldId = currentState[ch];

    if (newId && newId !== oldId) {
      currentState[ch] = newId;
      updateCell(ch, newId);
    }
  });

  persistState();
}, 60000);

/* =========================
   INIT FINAL
========================= */

(function boot() {
  restoreState();

  if (Object.keys(currentState).length > 0) {
    const channels = Object.keys(currentState);

    renderLayout(channels);

    clearCanvas();

    channels.forEach(ch => {
      const cell = createVideoCell(ch, currentState[ch]);

      cellMap[ch] = cell;
      canvas.appendChild(cell);
    });
  }

  status.textContent = "Mosaic pronto";
})();
</script>

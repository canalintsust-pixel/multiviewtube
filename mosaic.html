<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mosaic Live</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* -------------------------
       CANVAS 16:9 FIXO
    -------------------------- */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-width: 177.78vh;
      max-height: 100vh;
      display: grid;
      background: black;
      overflow: hidden;
    }

    /* CELULAS DOS VIDEOS */
    .cell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* -------------------------
       OVERLAY BASE (PASSO 7 PRÉVIO)
    -------------------------- */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: #222;
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #333;
      min-width: 160px;
      text-align: center;
    }

    .btn:hover {
      background: #333;
    }

    /* STATUS */
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #aaa;
      font-size: 12px;
      z-index: 5;
    }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="overlay">
  <div class="btn">TROCAR</div>
  <div class="btn">SUBSTITUIR</div>
  <div class="btn">LAYOUT</div>
  <div class="btn">ATUALIZAR TODAS</div>
</div>

<div id="status">Inicializando...</div>

<script>
/* =========================
   CONFIG BASE
========================= */

const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev/";
const canvas = document.getElementById("canvas");
const overlay = document.getElementById("overlay");
const status = document.getElementById("status");

/* canais selecionados no index.html */
const selected = JSON.parse(localStorage.getItem("selectedChannels") || "[]");

/* cache de estado (IMPORTANTE PASSO 6+) */
let currentState = {};

/* controle de loop */
let isLoading = false;
</script>
<script>

/* =========================
   GRID ENGINE
========================= */

function setGrid(cols, rows) {
  canvas.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  canvas.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

function clearCanvas() {
  canvas.innerHTML = "";
}

/* cria célula base */
function createCell(channelId, contentNode) {
  const div = document.createElement("div");
  div.className = "cell";
  div.dataset.channel = channelId;

  if (contentNode) {
    div.appendChild(contentNode);
  }

  return div;
}

/* =========================
   LAYOUT ENGINE 1–6 LIVES
========================= */

function applyLayout(channels) {
  const n = channels.length;

  // 0
  if (n === 0) {
    setGrid(1, 1);
    status.textContent = "Nenhuma live selecionada";
    return;
  }

  // 1 LIVE
  if (n === 1) {
    setGrid(1, 1);
  }

  // 2 LIVES
  else if (n === 2) {
    setGrid(2, 1);
  }

  // 3 LIVES (2 em cima + 1 embaixo)
  else if (n === 3) {
    setGrid(2, 2);
  }

  // 4 LIVES (2x2)
  else if (n === 4) {
    setGrid(2, 2);
  }

  // 5 LIVES (3 em cima + 2 embaixo)
  else if (n === 5) {
    setGrid(3, 2);
  }

  // 6 LIVES (3x2)
  else {
    setGrid(3, 2);
  }
}

/* =========================
   RENDER BASE (PLACEHOLDERS)
========================= */

function renderSkeleton(channels) {
  clearCanvas();
  applyLayout(channels);

  channels.slice(0, 6).forEach((ch, index) => {
    const placeholder = document.createElement("div");
    placeholder.style.width = "100%";
    placeholder.style.height = "100%";
    placeholder.style.display = "flex";
    placeholder.style.alignItems = "center";
    placeholder.style.justifyContent = "center";
    placeholder.style.color = "#666";
    placeholder.style.fontSize = "14px";
    placeholder.textContent = ch;

    const cell = createCell(ch, placeholder);
    canvas.appendChild(cell);
  });
}

/* =========================
   INIT BASE VISUAL
========================= */

function init() {
  if (!selected.length) {
    status.textContent = "Nenhum canal selecionado";
    return;
  }

  status.textContent = "Carregando layout...";
  renderSkeleton(selected);
}

init();

</script>
<script>

/* =========================
   YOUTUBE EMBED BUILDER
========================= */

function buildEmbed(videoId) {
  return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

/* =========================
   STATE CACHE (PASSO 6)
========================= */

let currentState = {}; 
// { "@channel": "videoId" }

/* =========================
   CREATE IFRAME CELL
========================= */

function createIframe(videoId) {
  const iframe = document.createElement("iframe");
  iframe.src = buildEmbed(videoId);
  iframe.allow = "autoplay; encrypted-media";
  iframe.allowFullscreen = true;
  return iframe;
}

/* =========================
   RENDER REAL STREAMS
========================= */

function renderStreams(data) {
  const channels = Object.keys(data);

  clearCanvas();
  applyLayout(channels);

  channels.slice(0, 6).forEach((ch) => {
    const videoId = data[ch];

    const content = videoId
      ? createIframe(videoId)
      : (() => {
          const div = document.createElement("div");
          div.style.width = "100%";
          div.style.height = "100%";
          div.style.display = "flex";
          div.style.alignItems = "center";
          div.style.justifyContent = "center";
          div.style.color = "#666";
          div.textContent = "Offline";
          return div;
        })();

    const cell = createCell(ch, content);
    canvas.appendChild(cell);

    // salva estado inicial
    currentState[ch] = videoId;
  });
}

/* =========================
   UPDATE SINGLE CELL (NO RELOAD ALL)
========================= */

function updateCell(channel, newVideoId) {
  const cell = canvas.querySelector(`[data-channel="${channel}"]`);
  if (!cell) return;

  const oldIframe = cell.querySelector("iframe");

  if (oldIframe && newVideoId) {
    oldIframe.src = buildEmbed(newVideoId);
  }
}

/* =========================
   DIFF ENGINE (BASE DO PASSO 6 REAL)
========================= */

function diffUpdate(data) {
  Object.keys(data).forEach(ch => {
    const newId = data[ch];
    const oldId = currentState[ch];

    if (newId && newId !== oldId) {
      updateCell(ch, newId);
      currentState[ch] = newId;
    }
  });
}

    </script>
    <script>

/* =========================
   WORKER CONFIG
========================= */

const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev/";

let isLoading = false;

/* =========================
   FETCH WORKER DATA
========================= */

async function fetchLiveData() {
  if (!selected.length) return {};

  try {
    isLoading = true;
    status.textContent = "Atualizando lives...";

    const res = await fetch(
      `${WORKER_URL}?channels=${selected.join(",")}`
    );

    const data = await res.json();

    status.textContent = "OK - ao vivo";

    return data;

  } catch (err) {
    console.error(err);
    status.textContent = "Erro ao carregar Worker";
    return {};
  } finally {
    isLoading = false;
  }
}

/* =========================
   MAIN UPDATE CYCLE
========================= */

async function updateCycle() {
  if (isLoading) return;

  const data = await fetchLiveData();

  if (!data || Object.keys(data).length === 0) return;

  // primeira renderização vs incremental
  if (Object.keys(currentState).length === 0) {
    renderStreams(data);
  } else {
    diffUpdate(data);
  }
}

/* =========================
   AUTO LOOP
========================= */

function startLoop() {
  updateCycle();

  setInterval(() => {
    updateCycle();
  }, 60000); // 60s refresh
}

/* =========================
   INIT ENTRYPOINT
========================= */

function initApp() {
  if (!selected.length) {
    status.textContent = "Nenhum canal selecionado";
    return;
  }

  status.textContent = "Iniciando multiview...";
  startLoop();
}

initApp();

    </script>
    <script>

/* =========================
   OVERLAY SYSTEM
========================= */

let overlayVisible = false;
let overlayTimer = null;

function showOverlay() {
  overlay.style.display = "flex";
  overlayVisible = true;

  // auto-hide em 2.5s
  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(() => {
    hideOverlay();
  }, 2500);
}

function hideOverlay() {
  overlay.style.display = "none";
  overlayVisible = false;
}

/* =========================
   TOGGLE OVERLAY (TOQUE/CLICK)
========================= */

function toggleOverlay() {
  if (overlayVisible) {
    hideOverlay();
  } else {
    showOverlay();
  }
}

/* ativa clique no canvas inteiro */
canvas.addEventListener("click", toggleOverlay);

/* =========================
   BOTÕES (BASE FUNCIONAL)
========================= */

const buttons = overlay.querySelectorAll(".btn");

/* 0 - TROCAR (placeholder funcional)
   futuro: swap de canais */
buttons[0].onclick = () => {
  status.textContent = "TROCAR (em breve)";
  hideOverlay();
};

/* 1 - SUBSTITUIR */
buttons[1].onclick = async () => {
  const ch = prompt("Digite o canal (@exemplo):");
  const url = prompt("Cole a URL da live:");

  if (!ch || !url) return;

  // tenta extrair videoId simples
  const match = url.match(/([a-zA-Z0-9_-]{11})/);

  if (match) {
    currentState[ch] = match[1];
    diffUpdate({ [ch]: match[1] });
  }

  hideOverlay();
};

/* 2 - LAYOUT */
buttons[2].onclick = () => {
  status.textContent = "LAYOUT (em breve)";
  hideOverlay();
};

/* 3 - ATUALIZAR TODAS */
buttons[3].onclick = async () => {
  status.textContent = "Atualizando tudo...";

  const data = await fetchLiveData();

  clearCanvas();
  renderStreams(data);

  hideOverlay();
});

/* =========================
   FINAL INIT HOOK
========================= */

document.addEventListener("DOMContentLoaded", () => {
  hideOverlay();
});

    </script>

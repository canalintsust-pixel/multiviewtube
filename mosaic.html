<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE FIX (REMOVE BUG ANDROID + GREEN BAR)
========================= */

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
}

/* =========================
   CENTRAL CANVAS 16:9
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-height:100vh;
    max-width:calc(100vh * 16 / 9);

    background:black;

    display:grid;
    gap:2px; /* 🔥 quase zero espaço */
}

/* =========================
   TILE 16:9 PERFEITO
========================= */

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* iframe FIXO */
iframe {
    position:absolute;
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   OVERLAY MINIMALISTA
========================= */

#overlay {
    position:fixed;
    top:8px;
    right:8px;
    z-index:9999;
    opacity:0.2;
}

#overlay:hover {
    opacity:1;
}

button {
    background:#ff0000;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* fullscreen limpa UI */
.fullscreen #overlay {
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="overlay">
    <button onclick="toggleFS()">TELA CHEIA</button>
</div>

<div id="stage"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let dragIndex = null;

/* =========================
   ID YOUTUBE
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   GRID INTELIGENTE DENTRO DO CANVAS 16:9
========================= */

function getGrid(n){

    if(n === 1) return "1 / 1 / 2 / 2";

    if(n === 2) return "1 / 2 / 2 / 3";

    if(n === 3) return "repeat(2, 1fr) / repeat(2, 1fr)";

    if(n === 4) return "repeat(2, 1fr) / repeat(2, 1fr)";

    if(n === 5) return "repeat(2, 1fr) / repeat(3, 1fr)";

    return "repeat(2, 1fr) / repeat(3, 1fr)";
}

/* =========================
   LOAD MOSAICO
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);

    /* layout automático simples e estável */
    let cols = (n <= 2) ? 2 : (n <= 4 ? 2 : 3);
    let rows = (n <= 2) ? 1 : 2;

    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>
        `;

        stage.appendChild(tile);
    }
}

/* =========================
   FULLSCREEN
========================= */

function toggleFS(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");

    } else {

        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   START
========================= */

load();

</script>

</body>
</html>

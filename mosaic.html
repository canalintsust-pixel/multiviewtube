<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic Pro</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   STAGE 16:9 CONTROLADO
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-height:100vh;
    max-width:calc(100vh * 16 / 9);

    display:grid;
    gap:2px;
    background:black;
}

/* =========================
   TILE
========================= */

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    border:1px solid #111;
}

.tile.dragging {
    opacity:0.5;
}

/* iframe */
iframe {
    width:100%;
    height:100%;
    border:none;
}

/* offline overlay */
.offline {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.85);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:14px;
    z-index:5;
}

/* =========================
   OVERLAY INTELIGENTE
========================= */

#overlay {
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;

    display:flex;
    gap:6px;

    opacity:0;
    transition:0.25s;
}

body.showUI #overlay {
    opacity:1;
}

button {
    background:#ff0000;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* =========================
   MODAL SUBSTITUIR LIVE
========================= */

#modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

#modalBox {
    background:#111;
    padding:15px;
    border-radius:10px;
    width:80%;
    max-width:400px;
}

#modal input {
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:6px;
}

#modalActions {
    margin-top:10px;
    display:flex;
    justify-content:space-between;
}

/* fullscreen */
.fullscreen #overlay {
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="overlay">
    <button onclick="toggleFS()">TELA CHEIA</button>
</div>

<div id="stage"></div>

<!-- MODAL -->
<div id="modal">
    <div id="modalBox">
        <div style="color:white;">Substituir Live</div>
        <input id="newUrl" placeholder="Cole nova URL">
        <div id="modalActions">
            <button onclick="applyReplace()">OK</button>
            <button onclick="closeModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let dragIndex = null;
let selectedIndex = null;

/* =========================
   EXTRAI ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT 16:9
========================= */

function layout(n){

    let stage = document.getElementById("stage");

    let cols = (n <= 2) ? 2 : (n <= 4 ? 2 : 3);
    let rows = (n <= 2) ? 1 : 2;

    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* =========================
   RENDER (SEM FULL RELOAD PESADO)
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);

    layout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = i;

        tile.draggable = true;

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>

            <div class="offline" style="display:none;">
                LIVE OFFLINE<br>
                <button onclick="openReplace(${i})">SUBSTITUIR</button>
            </div>

            <button style="
                position:absolute;
                bottom:5px;
                right:5px;
                z-index:10;
                font-size:10px;
            " onclick="openReplace(${i})">
                TROCAR
            </button>
        `;

        /* =========================
           SELEÇÃO
        ========================= */

        tile.addEventListener("click", ()=>{
            selectedIndex = i;
            showUI();
        });

        /* =========================
           DRAG
        ========================= */

        tile.addEventListener("dragstart", ()=>{
            dragIndex = i;
            tile.classList.add("dragging");
        });

        tile.addEventListener("dragend", ()=>{
            tile.classList.remove("dragging");
        });

        tile.addEventListener("dragover", e=>{
            e.preventDefault();
        });

        tile.addEventListener("drop", e=>{
            e.preventDefault();

            if(dragIndex === null) return;

            let tmp = videos[dragIndex];
            videos[dragIndex] = videos[i];
            videos[i] = tmp;

            save();
            load();
        });

        stage.appendChild(tile);
    }

    setTimeout(checkOffline, 5000);
}

/* =========================
   OFFLINE CHECK (UI)
========================= */

function checkOffline(){

    document.querySelectorAll("iframe").forEach((frame, i)=>{

        try{
            if(!frame.contentWindow){
                showOffline(i);
            }
        }catch(e){
            showOffline(i);
        }

    });
}

function showOffline(i){

    let tiles = document.querySelectorAll(".tile");
    if(!tiles[i]) return;

    tiles[i].querySelector(".offline").style.display = "flex";
}

/* =========================
   REPLACE LIVE (MODAL)
========================= */

let replaceIndex = null;

function openReplace(i){
    replaceIndex = i;
    document.getElementById("modal").style.display = "flex";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

function applyReplace(){

    let url = document.getElementById("newUrl").value;

    if(!url) return;

    videos[replaceIndex] = url;

    save();
    load();

    closeModal();
}

/* =========================
   SAVE
========================= */

function save(){
    localStorage.setItem("videos", JSON.stringify(videos));
}

/* =========================
   FULLSCREEN
========================= */

function toggleFS(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");

    } else {

        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   OVERLAY INTELIGENTE
========================= */

let uiTimer = null;

function showUI(){

    document.body.classList.add("showUI");

    clearTimeout(uiTimer);

    uiTimer = setTimeout(()=>{
        document.body.classList.remove("showUI");
    }, 2500);
}

/* touch global */
document.addEventListener("touchstart", showUI);
document.addEventListener("click", showUI);

/* =========================
   INIT
========================= */

load();

</script>

</body>
</html>

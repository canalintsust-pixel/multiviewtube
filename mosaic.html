<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mosaic Live</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ================= CANVAS 16:9 ================= */

#canvas{
    position:relative;

    width:100vw;
    height:56.25vw;

    max-width:177.78vh;
    max-height:100vh;

    background:#000;

    display:grid;
    gap:0;
}

/* ================= CELLS ================= */

.cell{
    position:relative;
    overflow:hidden;
    background:#000;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

/* ================= STATUS ================= */

#status{
    position:absolute;
    top:10px;
    left:10px;

    color:#aaa;
    font-family:Arial;
    font-size:12px;

    z-index:100;
}

/* ================= OVERLAY ================= */

#overlay{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,.65);

    display:none;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:12px;

    z-index:999;
}

.btn{
    min-width:220px;

    padding:12px 18px;

    background:#222;
    color:#fff;

    border:1px solid #444;
    border-radius:8px;

    cursor:pointer;

    font-family:Arial;
    text-align:center;
}

.btn:hover{
    background:#333;
}

/* ================= MODAIS ================= */

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.85);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:3000;
}

.modalBox{
    width:90%;
    max-width:450px;

    background:#111;

    padding:20px;

    border-radius:10px;

    color:white;

    font-family:Arial;
}

.modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;
}

.modalHeader button{
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.modalItem{
    padding:10px;
    margin-bottom:8px;

    border:1px solid #333;
    border-radius:6px;

    cursor:pointer;
}

.modalItem.selected{
    border-color:lime;
    background:#163216;
}

.modalAction{
    margin-top:15px;

    width:100%;

    padding:10px;

    cursor:pointer;
}

#newUrl{
    width:100%;
    box-sizing:border-box;

    padding:10px;

    margin-top:10px;
}

</style>
</head>

<body>

<div id="canvas"></div>

<div id="status">
Carregando...
</div>

<!-- ================= OVERLAY ================= -->

<div id="overlay">

    <div class="btn" onclick="openSwapModal()">
        TROCAR
    </div>

    <div class="btn" onclick="openReplaceModal()">
        SUBSTITUIR
    </div>

    <div class="btn" onclick="cycleLayout()">
        LAYOUT
    </div>

    <div class="btn" onclick="forceUpdate()">
        ATUALIZAR TODAS
    </div>

    <div class="btn" onclick="goBack()">
        VOLTAR
    </div>

</div>

<!-- ================= MODAL TROCAR ================= -->

<div id="swapModal" class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <span>TROCAR POSIÇÕES</span>

            <button onclick="closeSwapModal()">
                X
            </button>

        </div>

        <div id="swapList"></div>

        <button
            class="modalAction"
            onclick="confirmSwap()">

            TROCAR POSIÇÃO

        </button>

    </div>

</div>

<!-- ================= MODAL SUBSTITUIR ================= -->

<div id="replaceModal" class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <span>SUBSTITUIR LIVE</span>

            <button onclick="closeReplaceModal()">
                X
            </button>

        </div>

        <div id="replaceList"></div>

        <input
            id="newUrl"
            placeholder="Cole URL do YouTube">

        <button
            class="modalAction"
            onclick="confirmReplace()">

            SUBSTITUIR

        </button>

    </div>

</div>

<script>

/* ================= ELEMENTOS ================= */

const canvas =
document.getElementById("canvas");

const overlay =
document.getElementById("overlay");

const status =
document.getElementById("status");

const swapModal =
document.getElementById("swapModal");

const replaceModal =
document.getElementById("replaceModal");

/* ================= CONFIG ================= */

const WORKER_URL =
"https://polished-smoke-6d50.canalintsust.workers.dev/";

const selected =
JSON.parse(
localStorage.getItem("selectedChannels")
|| "[]"
);

/* ================= STATE ================= */

let state = [];

let overlayTimer = null;

let layoutMode = 0;

let swapSelection = [];

let replaceIndex = null;

/* ================= GRID ================= */

function setGrid(cols, rows){

    canvas.style.gridTemplateColumns =
    `repeat(${cols},1fr)`;

    canvas.style.gridTemplateRows =
    `repeat(${rows},1fr`;
}

/* ================= EMBED ================= */

function buildEmbed(videoId){

    return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

/* ================= CELL ================= */

function createCell(item,index){

    const div =
    document.createElement("div");

    div.className = "cell";

    div.dataset.index = index;

    const iframe =
    document.createElement("iframe");

    iframe.src =
    buildEmbed(item.videoId);

    div.appendChild(iframe);

    return div;
}

/* ================= UPDATE CELL ================= */

function updateCell(index,newId){

    const cell =
    canvas.querySelector(
        `[data-index="${index}"]`
    );

    if(!cell) return;

    const iframe =
    cell.querySelector("iframe");

    const expected =
    buildEmbed(newId);

    if(iframe.src === expected)
        return;

    iframe.src = expected;
}

/* ================= LAYOUT ================= */

function applyLayout(total){

    if(total === 1){

        setGrid(1,1);
    }

    else if(total === 2){

        setGrid(2,1);
    }

    else if(total <= 4){

        setGrid(2,2);
    }

    else{

        setGrid(3,2);
    }
}

/* ================= RENDER ================= */

function render(){

    canvas.innerHTML = "";

    applyLayout(state.length);

    state.forEach((item,index)=>{

        canvas.appendChild(
            createCell(item,index)
        );

    });
}

/* ================= OVERLAY ================= */

function hideOverlay(){

    overlay.style.display = "none";
}

function showOverlay(){

    overlay.style.display = "flex";

    clearTimeout(overlayTimer);

    overlayTimer =
    setTimeout(
        hideOverlay,
        2500
    );
}

function goBack(){

    window.location.href =
    "index.html";
}

/* ================= MODAL TROCAR ================= */

function openSwapModal(){

    hideOverlay();

    swapSelection = [];

    const list =
    document.getElementById("swapList");

    list.innerHTML = "";

    state.forEach((item,index)=>{

        const div =
        document.createElement("div");

        div.className =
        "modalItem";

        div.textContent =
        `Live ${index + 1} (${item.channel})`;

        div.onclick = ()=>{

            if(
                swapSelection.includes(index)
            ){

                swapSelection =
                swapSelection.filter(
                    v => v !== index
                );

                div.classList.remove(
                    "selected"
                );

                return;
            }

            if(
                swapSelection.length >= 2
            ){
                return;
            }

            swapSelection.push(index);

            div.classList.add(
                "selected"
            );
        };

        list.appendChild(div);

    });

    swapModal.style.display =
    "flex";
}

function closeSwapModal(){

    swapSelection = [];

    swapModal.style.display =
    "none";
}
    /* ================= CONFIRM SWAP ================= */

function confirmSwap(){

    if(swapSelection.length !== 2){

        alert(
            "Selecione exatamente 2 lives"
        );

        return;
    }

    const [a,b] = swapSelection;

    const temp = state[a];

    state[a] = state[b];

    state[b] = temp;

    saveState();

    render();

    closeSwapModal();
}

/* ================= MODAL SUBSTITUIR ================= */

function openReplaceModal(){

    hideOverlay();

    replaceIndex = null;

    document.getElementById(
        "newUrl"
    ).value = "";

    const list =
    document.getElementById(
        "replaceList"
    );

    list.innerHTML = "";

    state.forEach((item,index)=>{

        const div =
        document.createElement("div");

        div.className =
        "modalItem";

        div.textContent =
        `Live ${index + 1} (${item.channel})`;

        div.onclick = ()=>{

            replaceIndex = index;

            [...list.children]
            .forEach(el=>{

                el.classList.remove(
                    "selected"
                );

            });

            div.classList.add(
                "selected"
            );
        };

        list.appendChild(div);
    });

    replaceModal.style.display =
    "flex";
}

function closeReplaceModal(){

    replaceIndex = null;

    document.getElementById(
        "newUrl"
    ).value = "";

    replaceModal.style.display =
    "none";
}

function confirmReplace(){

    if(replaceIndex === null){

        alert(
            "Selecione uma live"
        );

        return;
    }

    const url =
    document.getElementById(
        "newUrl"
    ).value.trim();

    if(!url){

        alert(
            "Informe uma URL"
        );

        return;
    }

    const match =
    url.match(
        /([a-zA-Z0-9_-]{11})/
    );

    if(!match){

        alert(
            "Vídeo inválido"
        );

        return;
    }

    const videoId =
    match[1];

    state[replaceIndex].videoId =
    videoId;

    saveState();

    updateCell(
        replaceIndex,
        videoId
    );

    closeReplaceModal();
}

/* ================= LAYOUT ================= */

function cycleLayout(){

    layoutMode++;

    if(layoutMode > 2)
        layoutMode = 0;

    if(layoutMode === 0){

        applyLayout(
            state.length
        );
    }

    if(layoutMode === 1){

        setGrid(2,2);
    }

    if(layoutMode === 2){

        setGrid(3,2);
    }
}

/* ================= UPDATE ================= */

async function forceUpdate(){

    try{

        status.textContent =
        "Atualizando...";

        const response =
        await fetch(
            `${WORKER_URL}?channels=${selected.join(",")}`
        );

        const data =
        await response.json();

        state.forEach(
            (item,index)=>{

            const newId =
            data[item.channel];

            if(
                !newId ||
                newId === item.videoId
            ){
                return;
            }

            item.videoId =
            newId;

            updateCell(
                index,
                newId
            );

        });

        saveState();

        status.textContent =
        "AO VIVO";

    }
    catch(error){

        console.error(error);

        status.textContent =
        "Erro de atualização";
    }
}

/* ================= STORAGE ================= */

function saveState(){

    localStorage.setItem(
        "mosaicState",
        JSON.stringify(state)
    );
}

/* ================= INIT ================= */

async function init(){

    try{

        const saved =
        localStorage.getItem(
            "mosaicState"
        );

        if(saved){

            state =
            JSON.parse(saved);

            render();

            status.textContent =
            "AO VIVO";

            return;
        }

        status.textContent =
        "Carregando...";

        const response =
        await fetch(
            `${WORKER_URL}?channels=${selected.join(",")}`
        );

        const data =
        await response.json();

        state =
        Object.keys(data)
        .filter(
            ch => data[ch]
        )
        .map(ch=>({

            channel: ch,

            videoId:
            data[ch]

        }));

        saveState();

        render();

        status.textContent =
        "AO VIVO";
    }
    catch(error){

        console.error(error);

        status.textContent =
        "Falha ao carregar";
    }
}

/* ================= CLICK GLOBAL ================= */

document.body.addEventListener(
    "click",
    (e)=>{

    if(
        e.target.closest(".modalBox")
    ){
        return;
    }

    if(
        swapModal.style.display ===
        "flex"
    ){
        return;
    }

    if(
        replaceModal.style.display ===
        "flex"
    ){
        return;
    }

    if(
        e.target.closest("iframe")
    ){
        return;
    }

    if(
        e.target.classList.contains(
            "btn"
        )
    ){
        return;
    }

    showOverlay();
});

/* ================= EXPORTS ================= */

window.openSwapModal =
openSwapModal;

window.closeSwapModal =
closeSwapModal;

window.confirmSwap =
confirmSwap;

window.openReplaceModal =
openReplaceModal;

window.closeReplaceModal =
closeReplaceModal;

window.confirmReplace =
confirmReplace;

window.cycleLayout =
cycleLayout;

window.forceUpdate =
forceUpdate;

window.goBack =
goBack;

/* ================= START ================= */

init();

setInterval(
    forceUpdate,
    60000
);

</script>

</body>
</html>

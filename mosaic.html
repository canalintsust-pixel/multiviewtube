<!DOCTYPE html><html lang="pt-br"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MultiViewTube</title><style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

/* =========================
   CANVAS 16:9
========================= */

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#canvas{
    position:relative;

    width:100vw;
    height:56.25vw;

    max-width:177.78vh;
    max-height:100vh;

    background:#000;

    display:grid;

    overflow:hidden;
}

.cell{
    position:relative;
    overflow:hidden;
    background:#000;
}

.cell.selected{
    outline:3px solid lime;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   STATUS
========================= */

#status{
    position:fixed;

    top:10px;
    left:10px;

    z-index:1000;

    color:#fff;
    font-size:12px;

    background:rgba(0,0,0,.6);

    padding:6px 10px;
    border-radius:6px;
}

/* =========================
   OVERLAY
========================= */

#overlay{
    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    gap:12px;

    background:rgba(0,0,0,.65);

    z-index:1500;
}

.btn{
    min-width:220px;

    padding:14px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    color:white;

    background:#222;
}

.btn:hover{
    background:#333;
}

/* =========================
   MODAIS
========================= */

.modal{
    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.85);

    z-index:2000;
}

.modalBox{

    width:90%;
    max-width:450px;

    background:#111;

    border-radius:10px;

    padding:20px;

    color:white;
}

.modalHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;
}

.closeBtn{

    background:none;
    border:none;

    color:white;

    cursor:pointer;

    font-size:18px;
}

.modalList{

    max-height:300px;

    overflow:auto;

    margin-bottom:15px;
}

.modalItem{

    padding:10px;

    margin-bottom:6px;

    background:#222;

    border-radius:6px;
}

.modalItem.selected{

    outline:2px solid lime;
}

.modalAction{

    width:100%;

    margin-top:10px;

    padding:12px;

    cursor:pointer;
}

#replaceUrl{

    width:100%;

    box-sizing:border-box;

    padding:10px;

    margin-top:10px;
}

/* =========================
   ATUALIZAÇÃO
========================= */

#updateModal{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.8);

    z-index:2500;
}

#updateBox{

    background:#111;

    padding:20px;

    border-radius:10px;

    color:white;

    min-width:280px;
}

</style></head><body><div id="canvas"></div><div id="status">
Carregando...
</div><!-- =====================
OVERLAY
===================== --><div id="overlay"><button class="btn" onclick="openSwapModal()">
TROCAR
</button><button class="btn" onclick="openReplaceModal()">
SUBSTITUIR
</button><button class="btn" onclick="openLayoutModal()">
LAYOUT
</button><button class="btn" onclick="forceUpdate()">
ATUALIZAR TODAS
</button><button class="btn" onclick="goBack()">
VOLTAR
</button></div><!-- =====================
MODAL TROCAR
===================== --><div id="swapModal" class="modal"><div class="modalBox"><div class="modalHeader"><span>Trocar posições</span>

<button
class="closeBtn"
onclick="closeSwapModal()">
X
</button>

</div><div
id="swapList"
class="modalList">
</div><button
class="modalAction"
onclick="confirmSwap()">
TROCAR POSIÇÃO
</button>

</div></div><!-- =====================
MODAL SUBSTITUIR
===================== --><div id="replaceModal" class="modal"><div class="modalBox"><div class="modalHeader"><span>Substituir live</span>

<button
class="closeBtn"
onclick="closeReplaceModal()">
X
</button>

</div><div
id="replaceList"
class="modalList">
</div><input
id="replaceUrl"
type="text"
placeholder="Cole URL do YouTube">

<button
class="modalAction"
onclick="confirmReplace()">
SUBSTITUIR
</button>

</div></div><!-- =====================
MODAL LAYOUT
===================== --><div id="layoutModal" class="modal"><div class="modalBox"><div class="modalHeader"><span>Escolher layout</span>

<button
class="closeBtn"
onclick="closeLayoutModal()">
X
</button>

</div><div class="modalList"><div class="modalItem">
<label>
<input type="radio" name="layout" value="default" checked>
Layout padrão
</label>
</div><div class="modalItem">
<label>
<input type="radio" name="layout" value="sidebar">
Destaque lateral
</label>
</div><div class="modalItem">
<label>
<input type="radio" name="layout" value="double">
Duplo destaque
</label>
</div><div class="modalItem">
<label>
<input type="radio" name="layout" value="rotative">
Destaque rotativo
</label>
</div></div><button
class="modalAction"
onclick="applySelectedLayout()">
APLICAR
</button>

</div></div><!-- =====================
MODAL UPDATE
===================== --><div id="updateModal"><div id="updateBox"><div id="updateContent">
Atualizando...
</div></div></div>
<script>

const WORKER_URL =
"https://polished-smoke-6d50.canalintsust.workers.dev/";

const canvas =
document.getElementById("canvas");

const overlay =
document.getElementById("overlay");

const status =
document.getElementById("status");

const selectedChannels =
JSON.parse(
localStorage.getItem("selectedChannels") || "[]"
);

let state = [];

let overlayTimer = null;

let swapSelection = [];

let replaceSelection = null;

let currentLayout =
localStorage.getItem("layoutMode")
|| "default";

let rotativeIndex = 0;

/* =========================
EMBED
========================= */

function embedUrl(videoId){

    return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

/* =========================
GRID
========================= */

function setGrid(cols,rows){

    canvas.style.gridTemplateColumns =
    `repeat(${cols},1fr)`;

    canvas.style.gridTemplateRows =
    `repeat(${rows},1fr)`;
}

/* =========================
RENDER
========================= */

function render(){

    canvas.innerHTML = "";

    if(currentLayout === "default"){
        renderDefault();
        return;
    }

    if(currentLayout === "sidebar"){
        renderSidebar();
        return;
    }

    if(currentLayout === "double"){
        renderDouble();
        return;
    }

    if(currentLayout === "rotative"){
        renderRotative();
        return;
    }
}

/* =========================
LAYOUT PADRÃO
========================= */

function renderDefault(){

    const n = state.length;

    if(n===1) setGrid(1,1);
    else if(n===2) setGrid(2,1);
    else if(n<=4) setGrid(2,2);
    else setGrid(3,2);

    state.forEach(addCell);
}

/* =========================
SIDEBAR
========================= */

function renderSidebar(){

    if(state.length < 2){
        renderDefault();
        return;
    }

    canvas.style.display = "grid";

    canvas.style.gridTemplateColumns =
    "2fr 1fr";

    canvas.style.gridTemplateRows =
    `repeat(${state.length-1},1fr)`;

    const big = createCell(state[0],0);

    big.style.gridRow =
    `1 / span ${state.length-1}`;

    canvas.appendChild(big);

    state.slice(1).forEach((item,i)=>{

        const cell =
        createCell(item,i+1);

        canvas.appendChild(cell);
    });
}

/* =========================
DOUBLE
========================= */

function renderDouble(){

    if(state.length < 3){
        renderDefault();
        return;
    }

    setGrid(2,2);

    state.forEach(addCell);
}

/* =========================
ROTATIVE
========================= */

function renderRotative(){

    if(state.length < 2){
        renderDefault();
        return;
    }

    const copy =
    [...state];

    const highlighted =
    copy.splice(rotativeIndex,1)[0];

    copy.unshift(highlighted);

    canvas.style.gridTemplateColumns =
    "2fr 1fr";

    canvas.style.gridTemplateRows =
    `repeat(${copy.length-1},1fr)`;

    const big =
    createCell(copy[0],0);

    big.style.gridRow =
    `1 / span ${copy.length-1}`;

    canvas.appendChild(big);

    copy.slice(1).forEach((item,i)=>{

        canvas.appendChild(
            createCell(item,i+1)
        );
    });
}

/* =========================
CELL
========================= */

function createCell(item,index){

    const div =
    document.createElement("div");

    div.className = "cell";

    div.dataset.index = index;

    const iframe =
    document.createElement("iframe");

    iframe.src =
    embedUrl(item.videoId);

    div.appendChild(iframe);

    return div;
}

function addCell(item,index){

    canvas.appendChild(
        createCell(item,index)
    );
}

/* =========================
SWAP
========================= */

function openSwapModal(){

    swapSelection = [];

    const modal =
    document.getElementById("swapModal");

    const list =
    document.getElementById("swapList");

    list.innerHTML = "";

    state.forEach((item,index)=>{

        const div =
        document.createElement("div");

        div.className =
        "modalItem";

        div.innerHTML = `
        <label>
        <input type="checkbox">
        ${item.channel}
        </label>
        `;

        div.onclick = ()=>{

            if(swapSelection.includes(index)){

                swapSelection =
                swapSelection.filter(
                x=>x!==index
                );

                div.classList.remove(
                "selected"
                );

                return;
            }

            if(
              swapSelection.length>=2
            ){
              return;
            }

            swapSelection.push(index);

            div.classList.add(
            "selected"
            );
        };

        list.appendChild(div);
    });

    modal.style.display="flex";
}

function closeSwapModal(){

    document
    .getElementById("swapModal")
    .style.display="none";
}

function confirmSwap(){

    if(
      swapSelection.length!==2
    ){
        alert(
        "Selecione 2 lives"
        );
        return;
    }

    const [a,b] =
    swapSelection;

    const temp =
    state[a];

    state[a] =
    state[b];

    state[b] =
    temp;

    saveState();

    render();

    closeSwapModal();
}

/* =========================
REPLACE
========================= */

function openReplaceModal(){

    replaceSelection = null;

    const modal =
    document.getElementById(
    "replaceModal"
    );

    const list =
    document.getElementById(
    "replaceList"
    );

    list.innerHTML = "";

    state.forEach((item,index)=>{

        const div =
        document.createElement("div");

        div.className =
        "modalItem";

        div.textContent =
        item.channel;

        div.onclick = ()=>{

            replaceSelection =
            index;

            [...list.children]
            .forEach(x=>
                x.classList.remove(
                "selected"
                )
            );

            div.classList.add(
            "selected"
            );
        };

        list.appendChild(div);
    });

    modal.style.display="flex";
}

function closeReplaceModal(){

    document
    .getElementById(
    "replaceModal"
    )
    .style.display="none";
}

function confirmReplace(){

    if(
      replaceSelection===null
    ) return;

    const url =
    document.getElementById(
    "replaceUrl"
    ).value;

    const match =
    url.match(
    /([a-zA-Z0-9_-]{11})/
    );

    if(!match){
        alert("URL inválida");
        return;
    }

    state[
      replaceSelection
    ].videoId =
    match[1];

    saveState();

    render();

    closeReplaceModal();
}

/* =========================
LAYOUT
========================= */

function openLayoutModal(){

    document
    .getElementById(
    "layoutModal"
    )
    .style.display="flex";
}

function closeLayoutModal(){

    document
    .getElementById(
    "layoutModal"
    )
    .style.display="none";
}

function applySelectedLayout(){

    const radio =
    document.querySelector(
    'input[name="layout"]:checked'
    );

    currentLayout =
    radio.value;

    localStorage.setItem(
    "layoutMode",
    currentLayout
    );

    render();

    closeLayoutModal();
}

/* =========================
UPDATE
========================= */

async function forceUpdate(){

    const updateModal =
    document.getElementById(
    "updateModal"
    );

    const content =
    document.getElementById(
    "updateContent"
    );

    updateModal.style.display =
    "flex";

    content.innerHTML =
    "Atualizando canais...<br><br>";

    const res =
    await fetch(
    `${WORKER_URL}?channels=${selectedChannels.join(",")}`
    );

    const data =
    await res.json();

    state.forEach((item)=>{

        const newId =
        data[item.channel];

        if(
          newId &&
          newId!==item.videoId
        ){
            item.videoId =
            newId;
        }

        content.innerHTML +=
        `${item.channel} ✓<br>`;
    });

    saveState();

    render();

    setTimeout(()=>{

        updateModal.style.display =
        "none";

    },1500);
}

/* =========================
SAVE
========================= */

function saveState(){

    localStorage.setItem(
    "mosaicState",
    JSON.stringify(state)
    );
}

/* =========================
BACK
========================= */

function goBack(){

    window.location.href =
    "index.html";
}

/* =========================
LOAD
========================= */

async function init(){

    status.textContent =
    "Carregando...";

    const res =
    await fetch(
    `${WORKER_URL}?channels=${selectedChannels.join(",")}`
    );

    const data =
    await res.json();

    state =
    Object.keys(data)
    .filter(ch=>data[ch])
    .map(ch=>({

        channel:ch,

        videoId:data[ch]

    }));

    saveState();

    render();

    status.textContent =
    "AO VIVO";
}

/* =========================
OVERLAY
========================= */

function showOverlay(){

    overlay.style.display =
    "flex";

    clearTimeout(
    overlayTimer
    );

    overlayTimer =
    setTimeout(()=>{

        overlay.style.display =
        "none";

    },2500);
}

document.body
.addEventListener(
"click",
(e)=>{

    if(
      e.target.closest(".modal")
    ) return;

    if(
      e.target.closest(".btn")
    ) return;

    showOverlay();
});

/* =========================
ROTATIVE LOOP
========================= */

setInterval(()=>{

    if(
      currentLayout!==
      "rotative"
    ) return;

    if(
      state.length<2
    ) return;

    rotativeIndex++;

    if(
      rotativeIndex>=
      state.length
    ){
      rotativeIndex=0;
    }

    render();

},180000);

/* =========================
START
========================= */

init();

setInterval(
forceUpdate,
60000
);

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE IMERSIVO
========================= */

html, body {
    margin:0;
    padding:0;
    background:#000;
    overflow:hidden;
    height:100%;
    font-family:Arial;
}

/* =========================
   TOPBAR (OCULTA NO FULLSCREEN FUTURO)
========================= */

.topbar{
    display:flex;
    justify-content:space-between;
    padding:8px;
    background:#111;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
}

button{
    border:none;
    padding:8px 12px;
    border-radius:6px;
    background:#ff0000;
    color:white;
    font-size:13px;
}

/* =========================
   GRID PRINCIPAL
========================= */

#grid{
    display:grid;
    gap:4px;
    width:100vw;
    height:100vh;
    padding-top:45px;
    box-sizing:border-box;
}

/* =========================
   TILE 16:9 REAL
========================= */

.tile{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #222;
    cursor:grab;
}

/* highlight drag */
.tile.dragging{
    opacity:0.5;
}

/* iframe full */
iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   FULLSCREEN MODE
========================= */

.fullscreen {
    padding-top:0 !important;
}

.fullscreen .topbar{
    display:none;
}

</style>
</head>

<body>

<div class="topbar">
<button onclick="toggleFS()">⛶ FULLSCREEN</button>
<button onclick="reset()">RESET</button>
</div>

<div id="grid"></div>

<script>

/* =========================
   DADOS
========================= */

let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let dragIndex = null;

/* =========================
   EXTRAI ID YOUTUBE
========================= */

function extractID(url){

    if(!url) return null;

    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);

    return m ? m[2] : null;
}

/* =========================
   LAYOUT EXATO PEDIDO
========================= */

function getCols(n){

    // 1 → 1x1
    if(n === 1) return 1;

    // 2 → 2x1
    if(n === 2) return 2;

    // 3 → 4 colunas (layout especial)
    if(n === 3) return 4;

    // 4 → 2x2
    if(n === 4) return 2;

    // 5 → 6 colunas (3 em cima, 2 embaixo centralizados)
    if(n === 5) return 6;

    // 6 → 3x2
    return 3;
}

/* =========================
   APLICAR GRID
========================= */

function applyLayout(n){

    let grid = document.getElementById("grid");

    let cols = getCols(n);

    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

}

/* =========================
   RENDER PRINCIPAL
========================= */

function load(){

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    let n = Math.min(videos.length, 6);

    applyLayout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);

        if(!id) continue;

        let div = document.createElement("div");
        div.className = "tile";
        div.draggable = true;
        div.dataset.index = i;

        div.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>
        `;

        /* =========================
           DRAG START
        ========================= */

        div.addEventListener("dragstart", (e)=>{
            dragIndex = i;
            div.classList.add("dragging");
        });

        div.addEventListener("dragend", ()=>{
            div.classList.remove("dragging");
        });

        div.addEventListener("dragover", (e)=>{
            e.preventDefault();
        });

        /* =========================
           DROP SWAP
        ========================= */

        div.addEventListener("drop", (e)=>{
            e.preventDefault();

            let targetIndex = i;

            if(dragIndex === null) return;

            let temp = videos[dragIndex];
            videos[dragIndex] = videos[targetIndex];
            videos[targetIndex] = temp;

            localStorage.setItem("videos", JSON.stringify(videos));

            load();
        });

        grid.appendChild(div);
    }
}

/* =========================
   FULLSCREEN IMERSIVO
========================= */

function toggleFS(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

        document.body.classList.add("fullscreen");

    }else{

        document.exitFullscreen();

        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   RESET
========================= */

function reset(){

    localStorage.removeItem("videos");

    window.location.href = "index.html";
}

/* =========================
   START
========================= */

load();

</script>

</body>
</html>

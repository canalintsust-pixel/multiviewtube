<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mosaic Live</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Canvas 16:9 fixo */
    #canvas {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      display: grid;
      background: black;
    }

    .cell {
      position: relative;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #aaa;
      font-family: Arial;
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="status">Carregando lives...</div>

<script>
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

const selected = JSON.parse(localStorage.getItem("selectedChannels") || "[]");

const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev/";

/* CACHE LOCAL (ESSENCIAL DO PASSO 6) */
let currentState = {}; // { channel: videoId }

/* -------------------------
   GRID ENGINE
-------------------------- */

function setGrid(cols, rows) {
  canvas.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  canvas.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* -------------------------
   CREATE / UPDATE CELLS
-------------------------- */

function createCell(channel, videoId) {
  const wrapper = document.createElement("div");
  wrapper.className = "cell";
  wrapper.dataset.channel = channel;

  const iframe = document.createElement("iframe");

  iframe.src = buildEmbed(videoId);

  iframe.allow = "autoplay; encrypted-media";
  iframe.allowFullscreen = true;

  wrapper.appendChild(iframe);

  return wrapper;
}

function updateCell(cell, videoId) {
  const iframe = cell.querySelector("iframe");
  if (iframe) {
    iframe.src = buildEmbed(videoId);
  }
}

/* -------------------------
   YOUTUBE EMBED (SEU PADRÃO)
-------------------------- */

function buildEmbed(videoId) {
  return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

/* -------------------------
   LAYOUT SIMPLES (fixo base)
-------------------------- */

function applyLayout(n) {
  if (n === 1) setGrid(1,1);
  else if (n === 2) setGrid(2,1);
  else if (n <= 4) setGrid(2,2);
  else setGrid(3,2);
}

/* -------------------------
   RENDER INTELIGENTE
-------------------------- */

function render(data) {
  const channels = Object.keys(data);
  applyLayout(channels.length);

  // primeira renderização
  if (Object.keys(currentState).length === 0) {
    canvas.innerHTML = "";

    channels.forEach(ch => {
      const vid = data[ch];
      currentState[ch] = vid;

      const cell = createCell(ch, vid);
      canvas.appendChild(cell);
    });

    return;
  }

  // atualização incremental
  channels.forEach(ch => {
    const newVid = data[ch];
    const oldVid = currentState[ch];

    const cell = canvas.querySelector(`[data-channel="${ch}"]`);

    if (!cell) return;

    if (newVid && newVid !== oldVid) {
      updateCell(cell, newVid);
      currentState[ch] = newVid;
    }
  });
}

/* -------------------------
   FETCH WORKER
-------------------------- */

async function load() {
  try {
    status.textContent = "Atualizando...";

    const res = await fetch(`${WORKER_URL}?channels=${selected.join(",")}`);
    const data = await res.json();

    render(data);

    status.textContent = "OK - ao vivo";

  } catch (e) {
    console.error(e);
    status.textContent = "Erro no Worker";
  }
}

/* -------------------------
   INIT + AUTO UPDATE
-------------------------- */

load();
setInterval(load, 60000);
</script>

</body>
</html>

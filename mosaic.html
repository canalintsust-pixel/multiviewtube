<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE IMERSIVO TOTAL
========================= */

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   CANVAS 16:9 CENTRAL
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-height:100vh;
    max-width:calc(100vh * 16 / 9);

    display:grid;
    gap:2px;
}

/* =========================
   TILE
========================= */

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    border:1px solid #111;
    transition:0.15s;
}

.tile.active {
    border:2px solid #ff0000;
    transform:scale(1.01);
}

/* iframe */
iframe {
    position:absolute;
    width:100%;
    height:100%;
    border:none;
}

/* OFFLINE */
.offline::after{
    content:"LIVE OFFLINE";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    background:red;
    padding:6px 10px;
    font-size:12px;
    border-radius:6px;
}

/* =========================
   OVERLAY INTELIGENTE
========================= */

#overlay {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:9999;

    display:flex;
    justify-content:space-between;
    padding:8px;

    opacity:0;
    transition:0.2s;
    pointer-events:none;
}

#overlay.show {
    opacity:1;
    pointer-events:auto;
}

.btn {
    background:#ff0000;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* modal */
#modal {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#111;
    padding:12px;
    border-radius:10px;
    z-index:10000;
    display:none;
}

#modal input{
    width:250px;
    padding:8px;
}

#modal button{
    margin-top:8px;
    width:100%;
}

/* fullscreen overlay auto-hide */
.fullscreen #overlay {
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <button class="btn" onclick="toggleFS()">TELA CHEIA</button>
    <div>
        <button class="btn" onclick="openReplace()">SUBSTITUIR</button>
        <button class="btn" onclick="swapMode()">TROCAR POSIÇÃO</button>
    </div>
</div>

<!-- MODAL -->
<div id="modal">
    <input id="inputUrl" placeholder="Cole nova live">
    <button onclick="confirmReplace()">OK</button>
</div>

<!-- GRID -->
<div id="stage"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let selected = null;
let swapFirst = null;
let swapModeOn = false;

/* =========================
   ID YOUTUBE
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT 16:9
========================= */

function layout(n){
    let stage = document.getElementById("stage");

    let cols = (n<=2)?2:(n<=4?2:3);
    let rows = (n<=2)?1:2;

    stage.style.gridTemplateColumns = `repeat(${cols},1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows},1fr)`;
}

/* =========================
   RENDER
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length,6);
    layout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = i;

        tile.onclick = ()=>selectTile(tile,i);

        tile.innerHTML = `
            <iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"></iframe>
        `;

        stage.appendChild(tile);

        checkOffline(tile, i);
    }
}

/* =========================
   SELEÇÃO
========================= */

function selectTile(tile,i){

    document.querySelectorAll(".tile").forEach(t=>t.classList.remove("active"));

    tile.classList.add("active");
    selected = i;

    showOverlay();
}

/* =========================
   OVERLAY CONTROLLER
========================= */

let overlayTimer;

function showOverlay(){
    let o = document.getElementById("overlay");
    o.classList.add("show");

    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(()=>{
        o.classList.remove("show");
    },2500);
}

document.body.addEventListener("click", showOverlay);

/* =========================
   FULLSCREEN
========================= */

function toggleFS(){

    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");
    }else{
        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   SUBSTITUIR LIVE (MODAL)
========================= */

function openReplace(){

    if(selected === null) return;

    document.getElementById("modal").style.display = "block";
}

function confirmReplace(){

    let url = document.getElementById("inputUrl").value;

    if(!url || selected===null) return;

    videos[selected] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    document.getElementById("modal").style.display = "none";
    document.getElementById("inputUrl").value = "";

    load();
}

/* =========================
   TROCA DE POSIÇÃO (SWAP MODE)
========================= */

function swapMode(){
    swapModeOn = !swapModeOn;
    swapFirst = null;
    alert("Swap mode: " + (swapModeOn ? "ON" : "OFF"));
}

document.addEventListener("click", function(e){

    let tile = e.target.closest(".tile");
    if(!tile || !swapModeOn) return;

    let i = Number(tile.dataset.index);

    if(swapFirst === null){
        swapFirst = i;
        tile.style.border = "2px solid yellow";
    }else{

        let tmp = videos[swapFirst];
        videos[swapFirst] = videos[i];
        videos[i] = tmp;

        localStorage.setItem("videos", JSON.stringify(videos));

        swapFirst = null;
        load();
    }
});

/* =========================
   OFFLINE CHECK (BÁSICO)
========================= */

function checkOffline(tile,index){

    setTimeout(()=>{

        let iframe = tile.querySelector("iframe");

        try{
            if(!iframe.contentWindow){
                tile.classList.add("offline");
            }
        }catch(e){
            tile.classList.add("offline");
        }

    },8000);
}

/* =========================
   START
========================= */

load();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE FIX ANDROID
========================= */

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial;

    position:fixed;
    inset:0;
}

/* =========================
   GRID (SEM ALTURA FORÇADA)
========================= */

#grid{
    display:grid;
    width:100vw;
    height:100vh;

    /* 🔥 ÚNICO ESPAÇO CONTROLADO */
    gap:2px;

    align-content:center;
    justify-content:center;
}

/* =========================
   TILE 16:9 REAL (FONTE DA SOLUÇÃO)
========================= */

.tile{
    position:relative;

    /* 🔥 ISSO GARANTE 16:9 SEM DISTORÇÃO */
    aspect-ratio: 16 / 9;

    width:100%;
    max-height:100%;

    background:#111;
    border-radius:6px;
    overflow:hidden;
    border:1px solid #222;
}

/* iframe sempre preso */
iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
    top:0;
    left:0;
}

/* =========================
   OVERLAY
========================= */

#overlay{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
    display:flex;
    gap:8px;
    opacity:0.25;
}

#overlay:hover{
    opacity:1;
}

.btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* fullscreen hide overlay */
.fullscreen #overlay{
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="overlay">
    <button class="btn" onclick="toggleFS()">TELA CHEIA</button>
</div>

<div id="grid"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let dragIndex = null;

/* =========================
   ID YOUTUBE
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT CORRIGIDO (SEM ROW BREAK)
========================= */

function getCols(n){

    if(n === 1) return 1;
    if(n === 2) return 2;
    if(n === 3) return 2;
    if(n === 4) return 2;
    if(n === 5) return 3;
    return 3;
}

function applyLayout(n){

    let grid = document.getElementById("grid");

    let cols = getCols(n);

    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

    /* ❌ REMOVIDO COMPLETAMENTE:
       gridTemplateRows
    */
}

/* =========================
   RENDER
========================= */

function load(){

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    let n = Math.min(videos.length, 6);

    applyLayout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";

        tile.draggable = true;

        tile.innerHTML = `

            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>

            <button onclick="replace(${i})"
                style="
                position:absolute;
                bottom:5px;
                right:5px;
                z-index:5;
                font-size:10px;
                padding:4px 6px;
                background:#000000aa;
                color:white;
                border:1px solid #555;">
                TROCAR
            </button>
        `;

        tile.addEventListener("dragstart", ()=>{
            dragIndex = i;
        });

        tile.addEventListener("dragover", e=>{
            e.preventDefault();
        });

        tile.addEventListener("drop", e=>{
            e.preventDefault();

            if(dragIndex === null) return;

            let tmp = videos[dragIndex];
            videos[dragIndex] = videos[i];
            videos[i] = tmp;

            localStorage.setItem("videos", JSON.stringify(videos));

            load();
        });

        grid.appendChild(tile);
    }
}

/* =========================
   SUBSTITUI LIVE
========================= */

function replace(index){

    let url = prompt("Cole nova live:");

    if(!url) return;

    videos[index] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    load();
}

/* =========================
   FULLSCREEN FIX
========================= */

function toggleFS(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");

    }else{

        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   START
========================= */

load();

</script>

</body>
</html>

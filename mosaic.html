<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE IMERSIVO SEGURO
========================= */

html, body {
    margin:0;
    padding:0;
    background:#000;
    overflow:hidden;
    height:100%;
    width:100%;
    font-family:Arial;
}

/* =========================
   OVERLAY
========================= */

#overlay{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
    display:flex;
    gap:8px;
    opacity:0.25;
}

#overlay:hover{
    opacity:1;
}

.btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* =========================
   GRID (AGORA CONTROLADO)
========================= */

#grid{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;

    display:grid;
    gap:4px;

    /* importante: impede overflow visual */
    overflow:hidden;
    padding:4px;
    box-sizing:border-box;
}

/* =========================
   TILE WRAPPER (CORREÇÃO PRINCIPAL)
========================= */

.tile{
    position:relative;
    width:100%;
    height:100%;
    background:#111;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #222;
}

/* força iframe encaixar SEM extrapolar */
.tile iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
}

/* botão trocar live */
.swap{
    position:absolute;
    bottom:6px;
    right:6px;
    z-index:10;

    font-size:11px;
    padding:4px 6px;
    border-radius:4px;
    border:1px solid #555;
    background:#000000aa;
    color:white;
}

/* fullscreen remove overlay */
.fullscreen #overlay{
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="overlay">
    <button class="btn" onclick="toggleFS()">TELA CHEIA</button>
</div>

<div id="grid"></div>

<script>

/* =========================
   DADOS
========================= */

let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let dragIndex = null;

/* =========================
   EXTRATOR ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT EXATO
========================= */

function getCols(n){
    if(n === 1) return 1;
    if(n === 2) return 2;
    if(n === 3) return 4;
    if(n === 4) return 2;
    if(n === 5) return 6;
    return 3;
}

/* =========================
   APPLY GRID
========================= */

function applyLayout(n){
    document.getElementById("grid").style.gridTemplateColumns =
        `repeat(${getCols(n)}, 1fr)`;
}

/* =========================
   RENDER
========================= */

function load(){

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    let n = Math.min(videos.length, 6);

    applyLayout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = i;
        tile.draggable = true;

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>

            <button class="swap" onclick="replace(${i})">
                TROCAR
            </button>
        `;

        /* =========================
           DRAG & DROP
        ========================= */

        tile.addEventListener("dragstart", ()=>{
            dragIndex = i;
        });

        tile.addEventListener("dragover", (e)=>{
            e.preventDefault();
        });

        tile.addEventListener("drop", (e)=>{
            e.preventDefault();

            if(dragIndex === null) return;

            let tmp = videos[dragIndex];
            videos[dragIndex] = videos[i];
            videos[i] = tmp;

            localStorage.setItem("videos", JSON.stringify(videos));
            load();
        });

        grid.appendChild(tile);
    }
}

/* =========================
   TROCAR LIVE
========================= */

function replace(index){

    let url = prompt("Cole nova live:");

    if(!url) return;

    videos[index] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    load();
}

/* =========================
   FULLSCREEN
========================= */

function toggleFS(){

    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");
    }else{
        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   START
========================= */

load();

</script>

</body>
</html>

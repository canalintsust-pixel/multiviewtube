<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   CANVAS 16:9 FIXO
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-height:100vh;
    max-width:calc(100vh * 16 / 9);

    display:grid;
    gap:2px;
    background:black;
}

/* =========================
   TILE
========================= */

.tile {
    position:relative;
    background:#000;
    overflow:hidden;
}

/* iframe full */
iframe {
    position:absolute;
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   OVERLAY
========================= */

#overlay {
    position:fixed;
    top:8px;
    right:8px;
    z-index:9999;
    display:flex;
    gap:6px;
    opacity:0.25;
    transition:0.2s;
}

#overlay:hover {
    opacity:1;
}

button {
    background:#ff0000;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* fullscreen */
.fullscreen #overlay {
    opacity:0;
    pointer-events:none;
}

.smallbtn {
    background:#222;
    border:1px solid #444;
}

</style>
</head>

<body>

<div id="overlay">
    <button onclick="toggleFS()">TELA CHEIA</button>
</div>

<div id="stage"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let dragIndex = null;

/* =========================
   YOUTUBE ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT
========================= */

function layout(n){

    let stage = document.getElementById("stage");

    let cols = 1;
    let rows = 1;

    if(n === 1){ cols=1; rows=1; }
    else if(n === 2){ cols=2; rows=1; }
    else if(n === 3){ cols=2; rows=2; }
    else if(n === 4){ cols=2; rows=2; }
    else if(n === 5){ cols=3; rows=2; }
    else { cols=3; rows=2; }

    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* =========================
   RENDER SEM RELOAD TOTAL
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);

    layout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = i;
        tile.draggable = true;

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>

            <!-- BOTÃO TROCAR LIVE -->
            <button class="smallbtn"
                style="position:absolute;bottom:5px;right:5px;z-index:5;"
                onclick="replace(${i})">
                TROCAR
            </button>
        `;

        /* =========================
           DRAG & SWAP
        ========================= */

        tile.addEventListener("dragstart", () => {
            dragIndex = i;
        });

        tile.addEventListener("dragover", (e) => {
            e.preventDefault();
        });

        tile.addEventListener("drop", (e) => {

            e.preventDefault();

            let target = i;

            if(dragIndex === null || dragIndex === target) return;

            let tmp = videos[dragIndex];
            videos[dragIndex] = videos[target];
            videos[target] = tmp;

            save();
            load();
        });

        stage.appendChild(tile);
    }
}

/* =========================
   SUBSTITUIÇÃO INDIVIDUAL
========================= */

function replace(index){

    let url = prompt("Cole nova live ou vídeo:");

    if(!url) return;

    videos[index] = url;

    save();
    load();
}

/* =========================
   SALVAR
========================= */

function save(){
    localStorage.setItem("videos", JSON.stringify(videos));
}

/* =========================
   FULLSCREEN IMERSIVO
========================= */

function toggleFS(){

    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");
    } else {
        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   START
========================= */

load();

</script>

</body>
</html>

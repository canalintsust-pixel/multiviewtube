<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE IMERSIVO TOTAL
========================= */

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   CANVAS 16:9 CENTRAL
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-width:calc(100vh * 16 / 9);
    max-height:100vh;

    display:grid;
    gap:2px;
    background:black;
}

/* =========================
   TILE
========================= */

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    border:2px solid transparent;
}

.tile.selected {
    border:2px solid red;
    box-shadow:0 0 10px red;
}

/* iframe */
iframe {
    width:100%;
    height:100%;
    border:none;
}

/* OFFLINE */
.offline {
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(120,0,0,0.7);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:14px;
    z-index:5;
}

/* =========================
   OVERLAY (AUTO HIDE)
========================= */

#overlay {
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;

    display:flex;
    gap:6px;

    opacity:0;
    transition:0.2s;
    pointer-events:none;
}

#overlay.show {
    opacity:1;
    pointer-events:auto;
}

button {
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* fullscreen hides overlay */
.fullscreen #overlay {
    opacity:0;
    pointer-events:none;
}

/* =========================
   MODAL
========================= */

#modal {
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

#modalContent {
    background:#111;
    padding:15px;
    border-radius:10px;
    width:80%;
}

#modal input {
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <button onclick="toggleFS()">TELA CHEIA</button>
    <button onclick="swapAction()">TROCAR</button>
    <button onclick="openReplace()">SUBSTITUIR</button>
</div>

<!-- MODAL -->
<div id="modal">
    <div id="modalContent">
        <input id="urlInput" placeholder="Cole nova live">
        <button onclick="confirmReplace()">OK</button>
        <button onclick="closeModal()">CANCELAR</button>
    </div>
</div>

<!-- STAGE -->
<div id="stage"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let selected = null;
let swapBuffer = null;

/* =========================
   YOUTUBE ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   OVERLAY CONTROL
========================= */

let overlayTimer;

function showOverlay(){
    let o = document.getElementById("overlay");
    o.classList.add("show");

    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(()=>{
        o.classList.remove("show");
    }, 2500);
}

document.body.addEventListener("touchstart", showOverlay);

/* =========================
   GRID LAYOUT
========================= */

function layout(n){
    let stage = document.getElementById("stage");

    let cols = (n <= 2) ? 2 : (n <= 4 ? 2 : 3);
    let rows = (n <= 2) ? 1 : 2;

    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* =========================
   RENDER
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);
    layout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = i;

        if(selected === i) tile.classList.add("selected");

        tile.onclick = ()=>{
            selected = i;
            load();
            showOverlay();
        };

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        `;

        stage.appendChild(tile);

        checkLive(tile, i);
    }
}

/* =========================
   OFFLINE CHECK SIMPLES
========================= */

function checkLive(tile, index){

    setTimeout(()=>{

        let iframe = tile.querySelector("iframe");

        try {
            if(!iframe.contentWindow){
                showOffline(tile, index);
            }
        } catch(e){
            showOffline(tile, index);
        }

    }, 8000);
}

function showOffline(tile, index){

    let div = document.createElement("div");
    div.className = "offline";
    div.innerHTML = `
        LIVE OFFLINE<br>
        <button onclick="openReplace(${index})">SUBSTITUIR</button>
    `;

    tile.appendChild(div);
}

/* =========================
   SWAP
========================= */

function swapAction(){

    if(selected === null) return;

    if(swapBuffer === null){
        swapBuffer = selected;
        return;
    }

    let a = swapBuffer;
    let b = selected;

    let tmp = videos[a];
    videos[a] = videos[b];
    videos[b] = tmp;

    swapBuffer = null;
    selected = null;

    localStorage.setItem("videos", JSON.stringify(videos));
    load();
}

/* =========================
   MODAL REPLACE
========================= */

let replaceIndex = null;

function openReplace(index){

    replaceIndex = index ?? selected;

    document.getElementById("modal").style.display = "flex";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

function confirmReplace(){

    let url = document.getElementById("urlInput").value;

    if(!url) return;

    videos[replaceIndex] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    closeModal();
    load();
}

/* =========================
   FULLSCREEN
========================= */

function toggleFS(){

    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");
    } else {
        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   START
========================= */

load();
showOverlay();

</script>

</body>
</html>

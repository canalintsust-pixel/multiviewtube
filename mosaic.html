<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mosaic Live</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      display: grid;
      background: black;
    }

    .cell {
      position: relative;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ---------------- OVERLAY ---------------- */

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 999;
    }

    .btn {
      padding: 12px 18px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      font-family: Arial;
      cursor: pointer;
      min-width: 180px;
      text-align: center;
    }

    .btn:hover {
      background: #333;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #aaa;
      font-family: Arial;
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>

<body>

<div id="canvas"></div>
<div id="status">Carregando...</div>

<div id="overlay">
  <div class="btn" onclick="swapMode()">TROCAR</div>
  <div class="btn" onclick="replaceMode()">SUBSTITUIR</div>
  <div class="btn" onclick="cycleLayout()">LAYOUT</div>
  <div class="btn" onclick="forceUpdate()">ATUALIZAR TODAS</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const overlay = document.getElementById("overlay");
const status = document.getElementById("status");

const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev/";
const selected = JSON.parse(localStorage.getItem("selectedChannels") || "[]");

/* ---------------- STATE ---------------- */

let state = []; // [{channel, videoId}]
let selectedCells = [];
let overlayTimer = null;
let mode = null; // "swap" | "replace"

/* ---------------- GRID ---------------- */

function setGrid(c, r) {
  canvas.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
  canvas.style.gridTemplateRows = `repeat(${r}, 1fr)`;
}

/* ---------------- EMBED ---------------- */

function buildEmbed(id) {
  return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

/* ---------------- CELL ---------------- */

function createCell(item, index) {
  const div = document.createElement("div");
  div.className = "cell";
  div.dataset.index = index;

  const iframe = document.createElement("iframe");
  iframe.src = buildEmbed(item.videoId);

  div.appendChild(iframe);

  div.onclick = () => toggleSelect(div, index);

  return div;
}

function updateCell(index, videoId) {
  const cell = canvas.querySelector(`[data-index="${index}"]`);
  if (!cell) return;

  const iframe = cell.querySelector("iframe");
  iframe.src = buildEmbed(videoId);
}

/* ---------------- SELECTION ---------------- */


function toggleSelect(cell, index) {
  // MODO SWAP
  if (mode === "swap") {
    handleSwapSelection(cell, index);
    return;
  }

  // MODO REPLACE
  if (mode === "replace") {
    selectedCells = [index];
    replaceSelected();
    mode = null;
    return;
  }

  // fallback visual (modo normal)
  if (selectedCells.includes(index)) {
    selectedCells = selectedCells.filter(i => i !== index);
    cell.style.outline = "none";
  } else {
    if (selectedCells.length >= 2) return;

    selectedCells.push(index);
    cell.style.outline = "2px solid lime";
  }
}

/* ---------------- LAYOUT ---------------- */

function applyLayout(n) {
  if (n === 1) setGrid(1,1);
  else if (n === 2) setGrid(2,1);
  else if (n <= 4) setGrid(2,2);
  else setGrid(3,2);
}

/* ---------------- RENDER ---------------- */

function render() {
  canvas.innerHTML = "";
  applyLayout(state.length);

  state.forEach((item, i) => {
    const cell = createCell(item, i);
    canvas.appendChild(cell);
  });
}

/* ---------------- SWAP ---------------- */

function swapSelected() {
  if (selectedCells.length !== 2) return;

  const [a, b] = selectedCells;

  const temp = state[a];
  state[a] = state[b];
  state[b] = temp;

  saveState();
  render();

  selectedCells = [];
}
function handleSwapSelection(cell, index) {
  if (selectedCells.includes(index)) {
    selectedCells = selectedCells.filter(i => i !== index);
    cell.style.outline = "none";
    return;
  }

  selectedCells.push(index);
  cell.style.outline = "2px solid lime";

  if (selectedCells.length === 2) {
    swapSelected();
    mode = null;
  }
}
/* ---------------- REPLACE ---------------- */

function replaceSelected() {
  if (selectedCells.length !== 1) return;

  const index = selectedCells[0];
  const url = prompt("Cole nova URL do YouTube (@canal/live ou video)");

  if (!url) return;

  // extrai videoId simples
  const match = url.match(/([a-zA-Z0-9_-]{11})/);

  if (!match) return;

  state[index].videoId = match[1];

  saveState();
  updateCell(index, match[1]);

  selectedCells = [];
}

/* ---------------- LAYOUT CYCLE ---------------- */

let layoutMode = 0;
function cycleLayout() {
  layoutMode = (layoutMode + 1) % 3;

  const n = state.length;

  if (layoutMode === 0) setGrid(1,1);
  if (layoutMode === 1) setGrid(2,2);
  if (layoutMode === 2) setGrid(3,2);
}

/* ---------------- UPDATE ALL ---------------- */

async function forceUpdate() {
  status.textContent = "Atualizando...";

  const res = await fetch(`${WORKER_URL}?channels=${selected.join(",")}`);
  const data = await res.json();

  state.forEach((item, i) => {
    const newId = data[item.channel];

    if (newId && newId !== item.videoId) {
      item.videoId = newId;
      updateCell(i, newId);
    }
  });

  saveState();
  status.textContent = "AO VIVO";
}

/* ---------------- PERSIST ---------------- */

function saveState() {
  localStorage.setItem("mosaicState", JSON.stringify(state));
}

/* ---------------- LOAD ---------------- */

async function init() {
  const saved = localStorage.getItem("mosaicState");

  if (saved) {
    state = JSON.parse(saved);
    render();
    return;
  }

  const res = await fetch(`${WORKER_URL}?channels=${selected.join(",")}`);
  const data = await res.json();

  state = Object.keys(data).map(ch => ({
    channel: ch,
    videoId: data[ch]
  }));

  saveState();
  render();
}

/* ---------------- OVERLAY ---------------- */

function showOverlay() {
  overlay.style.display = "flex";

  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(() => {
    overlay.style.display = "none";
  }, 2500);
}

document.body.addEventListener("click", (e) => {
  if (e.target.closest("iframe")) return;
  if (e.target.classList.contains("btn")) return;
  if (mode) return; // evita overlay durante operação

  showOverlay();
});

/* ---------------- ACTION HOOKS ---------------- */
function swapMode() {
  mode = "swap";
  status.textContent = "Modo swap: selecione 2 telas";
}

function replaceMode() {
  mode = "replace";
  status.textContent = "Modo replace: selecione 1 tela";
}
window.swapMode = swapMode;
window.replaceMode = replaceMode;
window.cycleLayout = cycleLayout;
window.forceUpdate = forceUpdate;

/* ---------------- START ---------------- */

init();
setInterval(forceUpdate, 60000);
</script>

</body>
</html>

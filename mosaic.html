<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   STAGE 16:9 SAFE CANVAS
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-width:calc(100vh * 16 / 9);
    max-height:100vh;

    display:grid;
    gap:2px;
    background:black;
}

/* =========================
   TILE 16:9 FIX
========================= */

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    aspect-ratio:16/9;
}

iframe {
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   OVERLAY INTELIGENTE
========================= */

#overlay {
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;

    display:flex;
    gap:6px;

    opacity:0;
    transition:0.2s;
    pointer-events:none;
}

#overlay.show {
    opacity:1;
    pointer-events:auto;
}

button {
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

.modalContent {
    position:relative;
    background:#111;
    padding:15px;
    border-radius:10px;
    width:85%;
    max-height:80%;
    overflow:auto;
    color:white;
}

.gridList {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:8px;
}

.item {
    background:#222;
    padding:10px;
    border-radius:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.2s;
    border:2px solid transparent;
}

.item.selected {
    border:2px solid #00ff88;
    background:#2a2a2a;
}

input[type="checkbox"]{
    transform:scale(1.4);
}

.closeBtn{
    position:absolute;
    top:8px;
    right:8px;
    background:#444;
    border:none;
    color:white;
    padding:5px 10px;
    border-radius:6px;
    font-size:12px;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <button onclick="openSwap()">TROCAR</button>
    <button onclick="openReplace()">SUBSTITUIR</button>
    <button onclick="cycleLayout()">LAYOUT</button>
</div>

<!-- STAGE -->
<div id="stage"></div>

<!-- SWAP MODAL -->
<div id="swapModal" class="modal">
    <div class="modalContent">
        <button class="closeBtn" onclick="closeSwap()">✕</button>

        <h3>Trocar posições</h3>
        <p>Selecione 2 lives</p>

        <div id="swapList" class="gridList"></div>

        <button id="swapBtn" onclick="confirmSwap()" disabled>
            TROCAR POSIÇÃO
        </button>

        <button onclick="closeSwap()">CANCELAR</button>
    </div>
</div>

<!-- REPLACE MODAL -->
<div id="replaceModal" class="modal">
    <div class="modalContent">
        <button class="closeBtn" onclick="closeReplace()">✕</button>

        <h3>Substituir live</h3>

        <select id="replaceSelect"></select>

        <input id="replaceInput"
               placeholder="Cole nova URL"
               style="width:100%;padding:8px;margin-top:10px;">

        <button onclick="confirmReplace()">OK</button>
        <button onclick="closeReplace()">CANCELAR</button>
    </div>
</div>

<script>

/* =========================
   STATE
========================= */

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let layoutMode = 0;
let mainIndex = 0;
let swapSelected = [];

/* =========================
   OVERLAY AUTO HIDE
========================= */

let timer;

function showOverlay(){
    let o = document.getElementById("overlay");
    o.classList.add("show");

    clearTimeout(timer);
    timer = setTimeout(()=>{
        o.classList.remove("show");
    }, 2500);
}

document.body.addEventListener("touchstart", showOverlay);

/* =========================
   YOUTUBE ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT ENGINE
========================= */

function cycleLayout(){
    layoutMode = (layoutMode + 1) % 4;
    load();
}

/* =========================
   AUTO ROTATE
========================= */

setInterval(()=>{
    if(layoutMode === 3 && videos.length > 1){
        mainIndex = (mainIndex + 1) % videos.length;
        load();
    }
}, 180000);

/* =========================
   APPLY LAYOUT
========================= */

function applyLayout(n){

    let stage = document.getElementById("stage");

    if(layoutMode === 0){

        let cols = (n <= 2) ? 2 : (n <= 4 ? 2 : 3);
        let rows = (n <= 2) ? 1 : 2;

        stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        return;
    }

    if(layoutMode === 1){
        stage.style.gridTemplateColumns = "2fr 1fr";
        stage.style.gridTemplateRows = "repeat(3, 1fr)";
        return;
    }

    if(layoutMode === 2){
        stage.style.gridTemplateColumns = "repeat(3, 1fr)";
        stage.style.gridTemplateRows = "2fr 1fr";
        return;
    }

    if(layoutMode === 3){
        stage.style.gridTemplateColumns = "2fr 1fr";
        stage.style.gridTemplateRows = "repeat(3, 1fr)";
    }
}

/* =========================
   LOAD
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);

    applyLayout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";

        let isMain = (layoutMode === 3 && i === mainIndex);

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        `;

        stage.appendChild(tile);
    }
}

/* =========================
   SWAP
========================= */

function openSwap(){

    let modal = document.getElementById("swapModal");
    let list = document.getElementById("swapList");

    list.innerHTML = "";
    swapSelected = [];

    videos.forEach((v,i)=>{

        let div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            Live ${i+1}
            <input type="checkbox" onchange="toggleSwap(${i}, this)">
        `;

        list.appendChild(div);
    });

    document.getElementById("swapBtn").disabled = true;
    modal.style.display = "flex";
}

function toggleSwap(index, el){

    let items = document.querySelectorAll(".item");

    if(el.checked){

        if(swapSelected.length === 2){
            let removed = swapSelected.shift();
            document.querySelectorAll("input")[removed].checked = false;
            items[removed].classList.remove("selected");
        }

        swapSelected.push(index);
        items[index].classList.add("selected");

    } else {
        swapSelected = swapSelected.filter(i => i !== index);
        items[index].classList.remove("selected");
    }

    document.getElementById("swapBtn").disabled = swapSelected.length !== 2;
}

function confirmSwap(){

    let a = swapSelected[0];
    let b = swapSelected[1];

    let tmp = videos[a];
    videos[a] = videos[b];
    videos[b] = tmp;

    localStorage.setItem("videos", JSON.stringify(videos));

    closeSwap();
    load();
}

function closeSwap(){
    document.getElementById("swapModal").style.display = "none";
}

/* =========================
   REPLACE
========================= */

function openReplace(){

    let sel = document.getElementById("replaceSelect");
    sel.innerHTML = "";

    videos.forEach((v,i)=>{
        let opt = document.createElement("option");
        opt.value = i;
        opt.innerText = `Live ${i+1}`;
        sel.appendChild(opt);
    });

    document.getElementById("replaceModal").style.display = "flex";
}

function confirmReplace(){

    let i = document.getElementById("replaceSelect").value;
    let url = document.getElementById("replaceInput").value;

    if(!url) return;

    videos[i] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    closeReplace();
    load();
}

function closeReplace(){
    document.getElementById("replaceModal").style.display = "none";
}

/* =========================
   INIT
========================= */

load();
showOverlay();

</script>

</body>
</html>

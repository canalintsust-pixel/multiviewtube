<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE IMERSIVO
========================= */

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   CANVAS 16:9 CENTRAL
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-width:calc(100vh * 16 / 9);
    max-height:100vh;

    display:grid;
    gap:2px;
    background:black;
}

/* =========================
   TILE
========================= */

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    border:2px solid transparent;
}

.tile.selected {
    border:2px solid #ff0000;
    box-shadow:0 0 8px red;
}

iframe {
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   OVERLAY (AUTO HIDE)
========================= */

#overlay {
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;

    display:flex;
    gap:6px;

    opacity:0;
    transition:0.2s;
}

#overlay.show {
    opacity:1;
}

button {
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* fullscreen hide */
.fullscreen #overlay {
    opacity:0 !important;
    pointer-events:none;
}

/* =========================
   MODAL
========================= */

#modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

#modalBox {
    background:#111;
    padding:16px;
    border-radius:10px;
    width:80%;
}

#modal input {
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <button onclick="swapMode()">TROCAR</button>
    <button onclick="openReplace()">SUBSTITUIR</button>
</div>

<!-- MODAL -->
<div id="modal">
    <div id="modalBox">
        <input id="urlInput" placeholder="Cole nova live">
        <button onclick="confirmReplace()">OK</button>
        <button onclick="closeModal()">Cancelar</button>
    </div>
</div>

<!-- STAGE -->
<div id="stage"></div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let selected = null;
let swapFirst = null;

/* =========================
   EXTRAI ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   OVERLAY AUTO SHOW
========================= */

let timer;

function showOverlay(){
    let o = document.getElementById("overlay");
    o.classList.add("show");

    clearTimeout(timer);
    timer = setTimeout(()=>{
        o.classList.remove("show");
    }, 2500);
}

document.body.addEventListener("touchstart", showOverlay);

/* =========================
   LAYOUT
========================= */

function layout(n){

    let stage = document.getElementById("stage");

    let cols = (n <= 2) ? 2 : (n <= 4 ? 2 : 3);
    let rows = (n <= 2) ? 1 : 2;

    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* =========================
   RENDER
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);

    layout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";

        if(selected === i) tile.classList.add("selected");

        tile.onclick = ()=>{

            if(swapFirst === null){
                swapFirst = i;
            } else {
                swap(i);
            }

            selected = i;
            load();
            showOverlay();
        };

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        `;

        stage.appendChild(tile);
    }
}

/* =========================
   SWAP SYSTEM (2 TOQUES)
========================= */

function swap(second){

    if(swapFirst === null || swapFirst === second){
        swapFirst = second;
        return;
    }

    let tmp = videos[swapFirst];
    videos[swapFirst] = videos[second];
    videos[second] = tmp;

    swapFirst = null;

    localStorage.setItem("videos", JSON.stringify(videos));
    load();
}

/* =========================
   BOTÃO TROCAR (modo explicito)
========================= */

function swapMode(){

    if(swapFirst !== null){
        swapFirst = null;
    }
}

/* =========================
   SUBSTITUIR LIVE
========================= */

let replaceIndex = null;

function openReplace(){

    if(selected === null) return;

    replaceIndex = selected;

    document.getElementById("modal").style.display = "flex";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

function confirmReplace(){

    let url = document.getElementById("urlInput").value;

    if(!url) return;

    videos[replaceIndex] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    closeModal();
    load();
}

/* =========================
   START
========================= */

load();
showOverlay();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =====================================
   BASE
===================================== */

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;

    position:fixed;
    inset:0;

    font-family:Arial,sans-serif;
}

/* =====================================
   CANVAS 16:9
===================================== */

#stage{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-width:calc(100vh * 16 / 9);
    max-height:100vh;

    background:#000;

    display:grid;

    gap:2px;

    overflow:hidden;
}

/* =====================================
   TILES
===================================== */

.tile{

    position:relative;

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;
}

.tile iframe{

    width:100%;
    height:100%;

    border:none;

    display:block;
}

/* =====================================
   OVERLAY
===================================== */

#overlay{

    position:fixed;

    top:10px;
    right:10px;

    z-index:9999;

    display:flex;

    gap:6px;

    opacity:0;

    pointer-events:none;

    transition:opacity .25s;
}

#overlay.show{

    opacity:1;

    pointer-events:auto;
}

.ctrlBtn{

    border:none;

    background:#ff0000;

    color:#fff;

    padding:10px 12px;

    border-radius:8px;

    font-size:13px;

    font-weight:bold;
}

/* =====================================
   MODAL
===================================== */

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.88);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:10000;
}

.modalContent{

    position:relative;

    width:85%;

    max-width:700px;

    max-height:85%;

    overflow:auto;

    background:#111;

    border-radius:12px;

    padding:18px;

    color:white;
}

/* =====================================
   CLOSE BUTTON
===================================== */

.closeBtn{

    position:absolute;

    top:10px;
    right:10px;

    border:none;

    background:#444;

    color:white;

    border-radius:6px;

    padding:6px 10px;

    font-size:12px;
}

/* =====================================
   SWAP GRID
===================================== */

.gridList{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    margin-top:15px;
}

.item{

    background:#222;

    border:2px solid transparent;

    border-radius:8px;

    padding:12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    transition:.2s;
}

.item.selected{

    background:#2a2a2a;

    border-color:#00ff88;

    transform:scale(1.03);
}

.swapCheck{

    transform:scale(1.5);
}

/* =====================================
   FORM
===================================== */

.modal input,
.modal select{

    width:100%;

    box-sizing:border-box;

    margin-top:10px;

    padding:10px;

    border:none;

    border-radius:8px;

    background:#222;

    color:white;
}

.modalAction{

    margin-top:12px;

    border:none;

    border-radius:8px;

    padding:10px 12px;

    background:#ff0000;

    color:white;

    font-weight:bold;
}

/* =====================================
   LAYOUT MODAL
===================================== */

.layoutOption{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:12px;

    padding:10px;

    border-radius:8px;

    background:#222;
}

.layoutOption input{

    width:auto;

    margin:0;

    transform:scale(1.4);
}

/* =====================================
   LAYOUT 2
   DESTAQUE DIREITO
===================================== */

.layout-right{

    display:grid;

    grid-template-columns:
    3fr 1fr;

    grid-template-rows:
    repeat(3,1fr);

    gap:2px;
}

/* =====================================
   LAYOUT 3
   DUPLO DESTAQUE
===================================== */

.layout-double{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    grid-template-rows:
    2fr 1fr;

    gap:2px;
}

/* =====================================
   LAYOUT 4
   ROTATIVO
===================================== */

.layout-rotate{

    display:grid;

    grid-template-columns:
    3fr 1fr;

    gap:2px;
}

/* =====================================
   HELPERS
===================================== */

.hidden{

    display:none !important;
}

</style>
</head>

<body>

<!-- =====================================
     OVERLAY INTELIGENTE
===================================== -->

<div id="overlay">

    <button
        class="ctrlBtn"
        onclick="openSwap()">
        TROCAR
    </button>

    <button
        class="ctrlBtn"
        onclick="openReplace()">
        SUBSTITUIR
    </button>

    <button
        class="ctrlBtn"
        onclick="openLayoutModal()">
        LAYOUT
    </button>

</div>

<!-- =====================================
     CANVAS 16:9
===================================== -->

<div id="stage"></div>

<!-- =====================================
     MODAL TROCAR POSIÇÃO
===================================== -->

<div
    id="swapModal"
    class="modal">

    <div class="modalContent">

        <button
            class="closeBtn"
            onclick="closeSwap()">
            ✕
        </button>

        <h2>
            Trocar posição das lives
        </h2>

        <p>
            Selecione duas lives
        </p>

        <div
            id="swapList"
            class="gridList">
        </div>

        <button
            id="swapBtn"
            class="modalAction"
            onclick="confirmSwap()"
            disabled>

            TROCAR POSIÇÃO

        </button>

    </div>

</div>

<!-- =====================================
     MODAL SUBSTITUIR LIVE
===================================== -->

<div
    id="replaceModal"
    class="modal">

    <div class="modalContent">

        <button
            class="closeBtn"
            onclick="closeReplace()">
            ✕
        </button>

        <h2>
            Substituir live
        </h2>

        <p>
            Escolha a live
        </p>

        <select id="replaceSelect">
        </select>

        <input
            id="replaceInput"
            type="text"
            placeholder="Cole aqui a nova URL">

        <button
            class="modalAction"
            onclick="confirmReplace()">

            SUBSTITUIR

        </button>

    </div>

</div>

<!-- =====================================
     MODAL LAYOUT
===================================== -->

<div
    id="layoutModal"
    class="modal">

    <div class="modalContent">

        <button
            class="closeBtn"
            onclick="closeLayoutModal()">
            ✕
        </button>

        <h2>
            Layout de exibição
        </h2>

        <div class="layoutOption">

            <input
                type="radio"
                name="layoutMode"
                id="layout0"
                value="default">

            <label for="layout0">

                Layout padrão

            </label>

        </div>

        <div class="layoutOption">

            <input
                type="radio"
                name="layoutMode"
                id="layout1"
                value="right">

            <label for="layout1">

                Uma live grande +
                coluna lateral

            </label>

        </div>

        <div class="layoutOption">

            <input
                type="radio"
                name="layoutMode"
                id="layout2"
                value="double">

            <label for="layout2">

                Duas lives grandes +
                inferiores menores

            </label>

        </div>

        <div class="layoutOption">

            <input
                type="radio"
                name="layoutMode"
                id="layout3"
                value="rotate">

            <label for="layout3">

                Destaque rotativo
                automático

            </label>

        </div>

        <button
            class="modalAction"
            onclick="applyLayoutMode()">

            APLICAR

        </button>

    </div>

</div>

<!-- =====================================
     SCRIPT
===================================== -->

<script>
const canvas = document.getElementById("canvas");

const selected = JSON.parse(localStorage.getItem("selectedChannels") || "[]");

const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev";

let currentState = {};

/**
 * cria iframe real
 */
function createFrame(videoId) {
  const iframe = document.createElement("iframe");
  iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}`;
  iframe.allow = "autoplay; encrypted-media";
  iframe.allowFullscreen = true;
  return iframe;
}

/**
 * cria célula
 */
function createCell(channel, videoId) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.channel = channel;

  if (videoId) {
    cell.appendChild(createFrame(videoId));
  } else {
    cell.innerHTML = `
      <div style="color:#666;display:flex;align-items:center;justify-content:center;height:100%;font-family:Arial;">
        Offline
      </div>
    `;
  }

  return cell;
}

/**
 * layout simples inicial (grid base)
 */
function applyGrid(n) {
  if (n === 1) canvas.style.gridTemplate = "1fr / 1fr";
  if (n === 2) canvas.style.gridTemplate = "1fr / 1fr 1fr";
  if (n === 3) canvas.style.gridTemplate = "1fr 1fr / 1fr 1fr";
  if (n === 4) canvas.style.gridTemplate = "1fr 1fr / 1fr 1fr";
  if (n >= 5) canvas.style.gridTemplate = "1fr 1fr / 1fr 1fr 1fr";
}

/**
 * render inicial
 */
function render(data) {
  canvas.innerHTML = "";
  applyGrid(selected.length);

  selected.forEach((ch, i) => {
    const videoId = data[ch];
    canvas.appendChild(createCell(ch, videoId));
  });
}

/**
 * fetch Worker
 */
async function loadLives() {
  const query = selected.join(",");
  const res = await fetch(`${WORKER_URL}/?channels=${query}`);
  const data = await res.json();

  currentState = data;
  render(data);
}

/**
 * init
 */
loadLives();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   BASE IMERSIVO TOTAL
========================= */

html, body {
    margin:0;
    padding:0;
    background:#000;
    overflow:hidden;
    height:100%;
    font-family:Arial;
}

/* =========================
   GRID
========================= */

#grid{
    display:grid;
    width:100vw;
    height:100vh;
    gap:4px;
    box-sizing:border-box;
}

/* =========================
   TILE
========================= */

.tile{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    overflow:hidden;
    border-radius:8px;
    border:1px solid #222;
}

/* iframe */
iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   OVERLAY CONTROLS (IMERSIVO)
========================= */

#overlay{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
    display:flex;
    gap:8px;
    opacity:0.2;
    transition:0.2s;
}

#overlay:hover{
    opacity:1;
}

.btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* =========================
   FULLSCREEN STATE
========================= */

.fullscreen #overlay{
    opacity:0; /* some completamente */
}

</style>
</head>

<body>

<!-- =========================
     CONTROLES FLUTUANTES
========================= -->

<div id="overlay">
    <button class="btn" onclick="toggleFS()">TELA CHEIA</button>
</div>

<!-- GRID -->
<div id="grid"></div>

<script>

/* =========================
   DADOS
========================= */

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

let dragIndex = null;

/* =========================
   EXTRAI ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT INTELIGENTE
========================= */

function getCols(n){
    if(n === 1) return 1;
    if(n === 2) return 2;
    if(n === 3) return 4;
    if(n === 4) return 2;
    if(n === 5) return 6;
    return 3;
}

function applyLayout(n){
    document.getElementById("grid").style.gridTemplateColumns =
        `repeat(${getCols(n)}, 1fr)`;
}

/* =========================
   RENDER
========================= */

function load(){

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    let n = Math.min(videos.length, 6);

    applyLayout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);

        let tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = i;
        tile.draggable = true;

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>

            <!-- BOTÃO SUBSTITUIR LIVE -->
            <button onclick="replace(${i})"
                style="
                position:absolute;
                bottom:5px;
                right:5px;
                z-index:5;
                font-size:10px;
                padding:4px 6px;
                background:#000000aa;
                color:white;
                border:1px solid #555;">
                TROCAR
            </button>
        `;

        /* =========================
           DRAG START
        ========================= */

        tile.addEventListener("dragstart", ()=>{
            dragIndex = i;
        });

        tile.addEventListener("dragover", (e)=>{
            e.preventDefault();
        });

        tile.addEventListener("drop", (e)=>{
            e.preventDefault();

            if(dragIndex === null) return;

            let tmp = videos[dragIndex];
            videos[dragIndex] = videos[i];
            videos[i] = tmp;

            localStorage.setItem("videos", JSON.stringify(videos));

            load();
        });

        grid.appendChild(tile);
    }
}

/* =========================
   SUBSTITUI LIVE INDIVIDUAL
========================= */

function replace(index){

    let url = prompt("Cole nova live:");

    if(!url) return;

    videos[index] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    load();
}

/* =========================
   FULLSCREEN IMERSIVO REAL
========================= */

function toggleFS(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

        document.body.classList.add("fullscreen");

    }else{

        document.exitFullscreen();

        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   INÍCIO
========================= */

load();

</script>

</body>
</html>

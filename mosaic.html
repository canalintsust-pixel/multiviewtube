<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mosaic Live</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-width: 177.78vh;
      max-height: 100vh;
      display: grid;
      background: black;
      overflow: hidden;
    }

    .cell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: #222;
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #333;
      min-width: 160px;
      text-align: center;
    }

    .btn:hover {
      background: #333;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #aaa;
      font-size: 12px;
      z-index: 5;
    }
  </style>
</head>

<body>

<div id="canvas"></div>

<div id="overlay">
  <div class="btn">TROCAR</div>
  <div class="btn">SUBSTITUIR</div>
  <div class="btn">LAYOUT</div>
  <div class="btn">ATUALIZAR TODAS</div>
</div>

<div id="status">Inicializando...</div>

<script>
const WORKER_URL = "https://polished-smoke-6d50.canalintsust.workers.dev/";
const canvas = document.getElementById("canvas");
const overlay = document.getElementById("overlay");
const status = document.getElementById("status");

const selected = JSON.parse(localStorage.getItem("selectedChannels") || "[]");

let currentState = {};
let isLoading = false;
let overlayVisible = false;
let overlayTimer = null;

/* =========================
   GRID ENGINE
========================= */

function setGrid(cols, rows) {
  canvas.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  canvas.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

function clearCanvas() {
  canvas.innerHTML = "";
}

function createCell(channelId, contentNode) {
  const div = document.createElement("div");
  div.className = "cell";
  div.dataset.channel = channelId;

  if (contentNode) div.appendChild(contentNode);

  return div;
}

/* =========================
   LAYOUT ENGINE
========================= */

function applyLayout(channels) {
  const n = channels.length;

  if (n === 0) {
    setGrid(1, 1);
    return;
  }

  if (n === 1) setGrid(1, 1);
  else if (n === 2) setGrid(2, 1);
  else if (n <= 4) setGrid(2, 2);
  else if (n === 5) setGrid(3, 2);
  else setGrid(3, 2);
}

/* =========================
   EMBED
========================= */

function buildEmbed(videoId) {
  return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
}

function createIframe(videoId) {
  const iframe = document.createElement("iframe");
  iframe.src = buildEmbed(videoId);
  iframe.allow = "autoplay; encrypted-media";
  iframe.allowFullscreen = true;
  return iframe;
}

/* =========================
   RENDER
========================= */

function renderStreams(data) {
  const channels = Object.keys(data || {});

  clearCanvas();
  applyLayout(channels);

  channels.slice(0, 6).forEach((ch) => {
    const videoId = data[ch];

    const content = videoId
      ? createIframe(videoId)
      : (() => {
          const div = document.createElement("div");
          div.style.cssText =
            "width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#666";
          div.textContent = "Offline";
          return div;
        })();

    const cell = createCell(ch, content);
    canvas.appendChild(cell);

    currentState[ch] = videoId;
  });
}

/* =========================
   DIFF UPDATE
========================= */

function updateCell(channel, newVideoId) {
  const cell = canvas.querySelector(`[data-channel="${channel}"]`);
  if (!cell) return;

  const iframe = cell.querySelector("iframe");
  if (iframe && newVideoId) {
    iframe.src = buildEmbed(newVideoId);
  }
}

function diffUpdate(data) {
  Object.keys(data || {}).forEach(ch => {
    const newId = data[ch];
    const oldId = currentState[ch];

    if (newId && newId !== oldId) {
      updateCell(ch, newId);
      currentState[ch] = newId;
    }
  });
}

/* =========================
   WORKER
========================= */

async function fetchLiveData() {
  if (!selected.length) return {};

  try {
    isLoading = true;
    status.textContent = "Atualizando...";

    const res = await fetch(`${WORKER_URL}?channels=${selected.join(",")}`);
    const data = await res.json();

    status.textContent = "OK - ao vivo";
    return data;

  } catch (e) {
    console.error(e);
    status.textContent = "Erro Worker";
    return {};
  } finally {
    isLoading = false;
  }
}

/* =========================
   LOOP
========================= */

async function updateCycle() {
  if (isLoading) return;

  const data = await fetchLiveData();
  if (!data || Object.keys(data).length === 0) return;

  if (Object.keys(currentState).length === 0) {
    renderStreams(data);
  } else {
    diffUpdate(data);
  }
}

function startLoop() {
  updateCycle();
  setInterval(updateCycle, 60000);
}

/* =========================
   OVERLAY
========================= */

function showOverlay() {
  overlay.style.display = "flex";
  overlayVisible = true;

  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(hideOverlay, 2500);
}

function hideOverlay() {
  overlay.style.display = "none";
  overlayVisible = false;
}

function toggleOverlay() {
  overlayVisible ? hideOverlay() : showOverlay();
}

canvas.addEventListener("click", toggleOverlay);

/* BUTTONS */

const buttons = overlay.querySelectorAll(".btn");

buttons[0].onclick = () => {
  status.textContent = "TROCAR";
  hideOverlay();
};

buttons[1].onclick = () => {
  const ch = prompt("Canal:");
  const url = prompt("URL:");

  if (!ch || !url) return;

  const match = url.match(/([a-zA-Z0-9_-]{11})/);

  if (match) {
    currentState[ch] = match[1];
    diffUpdate({ [ch]: match[1] });
  }

  hideOverlay();
};

buttons[2].onclick = () => {
  hideOverlay();
};

buttons[3].onclick = async () => {
  const data = await fetchLiveData();
  clearCanvas();
  renderStreams(data);
  hideOverlay();
};

/* =========================
   INIT
========================= */

function init() {
  if (!selected.length) {
    status.textContent = "Nenhum canal selecionado";
    return;
  }

  startLoop();
}

init();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    position:fixed;
    inset:0;
    font-family:Arial;
}

/* =========================
   GRID 16:9 CENTRAL
========================= */

#stage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:100vw;
    height:calc(100vw * 9 / 16);

    max-width:calc(100vh * 16 / 9);
    max-height:100vh;

    display:grid;
    gap:2px;
    background:black;
}

.tile {
    position:relative;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

iframe {
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   OVERLAY INTELIGENTE
========================= */

#overlay {
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;

    display:flex;
    gap:6px;

    opacity:0;
    transition:0.2s;
    pointer-events:none;
}

#overlay.show {
    opacity:1;
    pointer-events:auto;
}

button {
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* =========================
   MODAL BASE
========================= */

.modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
}

.modalContent {
    background:#111;
    padding:15px;
    border-radius:10px;
    width:85%;
    max-height:80%;
    overflow:auto;
    color:white;
    position:relative;
}

.modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.closeBtn{
    background:#333;
    border:none;
    color:white;
    padding:6px 10px;
    border-radius:6px;
}

/* =========================
   GRID LIST SWAP
========================= */

.gridList {
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:8px;
    margin-top:10px;
}

.item {
    background:#222;
    padding:10px;
    border-radius:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.2s;
}

.item.selected{
    background:#ff000055;
    border:1px solid #ff0000;
}

/* checkbox grande */
input[type="checkbox"]{
    transform:scale(1.4);
}

/* fullscreen safe */
.fullscreen #overlay {
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay">
    <button onclick="openSwap()">TROCAR</button>
    <button onclick="openReplace()">SUBSTITUIR</button>
</div>

<!-- GRID -->
<div id="stage"></div>

<!-- =========================
     SWAP MODAL
========================= -->
<div id="swapModal" class="modal" onclick="backdropClose(event,'swap')">
    <div class="modalContent" onclick="event.stopPropagation()">

        <div class="modalHeader">
            <h3>Trocar posições</h3>
            <button class="closeBtn" onclick="closeSwap()">X</button>
        </div>

        <p>Selecione 2 lives</p>

        <div id="swapList" class="gridList"></div>

        <button id="swapBtn" onclick="confirmSwap()" disabled>
            TROCAR POSIÇÃO
        </button>

    </div>
</div>

<!-- =========================
     REPLACE MODAL
========================= -->
<div id="replaceModal" class="modal" onclick="backdropClose(event,'replace')">
    <div class="modalContent" onclick="event.stopPropagation()">

        <div class="modalHeader">
            <h3>Substituir live</h3>
            <button class="closeBtn" onclick="closeReplace()">X</button>
        </div>

        <select id="replaceSelect"></select>

        <input id="replaceInput"
               placeholder="Cole nova URL"
               style="width:100%;padding:8px;margin-top:10px;">

        <button onclick="confirmReplace()">OK</button>
        <button onclick="closeReplace()">CANCELAR</button>

    </div>
</div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");

/* =========================
   OVERLAY AUTO
========================= */

let timer;

function showOverlay(){
    let o = document.getElementById("overlay");
    o.classList.add("show");

    clearTimeout(timer);
    timer = setTimeout(()=>{
        o.classList.remove("show");
    }, 2500);
}

document.body.addEventListener("touchstart", showOverlay);

/* =========================
   GRID
========================= */

function layout(n){
    let stage = document.getElementById("stage");

    let cols = (n <= 2) ? 2 : (n <= 4 ? 2 : 3);
    let rows = (n <= 2) ? 1 : 2;

    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    stage.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

/* =========================
   LOAD
========================= */

function load(){

    let stage = document.getElementById("stage");
    stage.innerHTML = "";

    let n = Math.min(videos.length, 6);
    layout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        `;

        stage.appendChild(tile);
    }
}

/* =========================
   YOUTUBE ID
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   SWAP SYSTEM
========================= */

let swapSelected = [];

function openSwap(){

    let modal = document.getElementById("swapModal");
    let list = document.getElementById("swapList");

    list.innerHTML = "";
    swapSelected = [];

    videos.forEach((v,i)=>{

        let div = document.createElement("div");
        div.className = "item";
        div.dataset.index = i;

        div.innerHTML = `
            Live ${i+1}
            <input type="checkbox" onchange="toggleSwap(${i}, this)">
        `;

        list.appendChild(div);
    });

    document.getElementById("swapBtn").disabled = true;
    modal.style.display = "flex";
}

function toggleSwap(index, el){

    let item = document.querySelectorAll(".item")[index];

    if(el.checked){

        if(swapSelected.length === 2){

            let removed = swapSelected.shift();

            let oldItem = document.querySelectorAll(".item")[removed];
            let oldCheckbox = oldItem.querySelector("input");

            oldCheckbox.checked = false;
            oldItem.classList.remove("selected");
        }

        swapSelected.push(index);
        item.classList.add("selected");

    } else {

        swapSelected = swapSelected.filter(i => i !== index);
        item.classList.remove("selected");
    }

    document.getElementById("swapBtn").disabled = swapSelected.length !== 2;
}

function confirmSwap(){

    let a = swapSelected[0];
    let b = swapSelected[1];

    [videos[a], videos[b]] = [videos[b], videos[a]];

    localStorage.setItem("videos", JSON.stringify(videos));

    closeSwap();
    load();
}

function closeSwap(){
    document.getElementById("swapModal").style.display = "none";
}

/* =========================
   REPLACE SYSTEM
========================= */

function openReplace(){

    let sel = document.getElementById("replaceSelect");
    sel.innerHTML = "";

    videos.forEach((v,i)=>{
        let opt = document.createElement("option");
        opt.value = i;
        opt.innerText = `Live ${i+1}`;
        sel.appendChild(opt);
    });

    document.getElementById("replaceModal").style.display = "flex";
}

function confirmReplace(){

    let i = document.getElementById("replaceSelect").value;
    let url = document.getElementById("replaceInput").value;

    if(!url) return;

    videos[i] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    closeReplace();
    load();
}

function closeReplace(){
    document.getElementById("replaceModal").style.display = "none";
}

/* =========================
   BACKDROP CLOSE
========================= */

function backdropClose(e,type){
    if(type === 'swap') closeSwap();
    if(type === 'replace') closeReplace();
}

/* =========================
   START
========================= */

load();
showOverlay();

</script>

</body>
</html>

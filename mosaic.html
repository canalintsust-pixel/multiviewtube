<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaico</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

/* barra superior */
#topbar{
    padding:10px;
    background:#1c1c1c;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
}

button{
    padding:10px;
    background:#333;
    color:white;
    border:none;
}

/* grid principal */
#grid{
    display:grid;
    gap:4px;
    padding:4px;
    height:calc(100vh - 60px);
}

/* container da live */
.tile{
    background:black;
    position:relative;
    overflow:hidden;
    aspect-ratio:16/9;
    border:1px solid #333;
}

/* iframe ocupa tudo */
iframe{
    width:100%;
    height:100%;
    border:0;
}

/* botão trocar link */
.swap{
    position:absolute;
    bottom:5px;
    right:5px;
    font-size:10px;
    background:#000a;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="fullscreen()">TELA CHEIA</button>
<button onclick="shuffle()">TROCAR POSIÇÃO</button>
<button onclick="reloadLives()">RELOAD</button>
</div>

<div id="grid"></div>

<script>

let links = [];

// pega links da URL
function load(){

    let params = new URLSearchParams(window.location.search);
    let raw = params.get("data") || "";

    raw = raw.replace(/\s/g,"");

    links = raw.split("https://").filter(Boolean)
               .map(x => "https://" + x)
               .slice(0,6);

    render();
}

function getId(url){
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

function render(){

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    let cols = 1;
    if(links.length == 2) cols = 2;
    else if(links.length <= 4) cols = 2;
    else cols = 3;

    grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;

    links.forEach((url,i)=>{

        let id = getId(url);

        let div = document.createElement("div");
        div.className = "tile";

        div.innerHTML = `
            <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1"></iframe>
            <button class="swap" onclick="swap(${i})">swap</button>
        `;

        grid.appendChild(div);
    });
}

function swap(i){

    let j = (i+1) % links.length;
    [links[i], links[j]] = [links[j], links[i]];
    render();
}

function shuffle(){
    links.sort(()=>Math.random()-0.5);
    render();
}

function fullscreen(){
    document.documentElement.requestFullscreen();
}

function reloadLives(){
    render();
}

window.onload = load;

</script>

</body>
</html>

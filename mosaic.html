<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MultiView Mosaic</title>

<style>

/* =========================
   RESET ANDROID SAFE
========================= */

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial;
}

/* =========================
   CENTRAL 16:9 STAGE (CORE FIX)
========================= */

#stage {
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    /* 🔥 FORÇA 16:9 REAL */
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;
}

/* =========================
   GRID DENTRO DO 16:9
========================= */

#grid{
    display:grid;
    width:100%;
    height:100%;
    gap:2px; /* 🔥 menor espaço vertical */
}

/* =========================
   TILE 16:9 PERFEITO
========================= */

.tile{
    position:relative;
    width:100%;
    height:100%;
    background:#111;
    overflow:hidden;
    border-radius:6px;
}

/* iframe fill */
iframe{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   OVERLAY
========================= */

#overlay{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
    opacity:0.25;
}

#overlay:hover{
    opacity:1;
}

.btn{
    background:#ff0000;
    color:white;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
}

/* fullscreen hide */
.fullscreen #overlay{
    opacity:0;
}

</style>
</head>

<body>

<div id="overlay">
    <button class="btn" onclick="toggleFS()">TELA CHEIA</button>
</div>

<!-- 🔥 STAGE 16:9 FIXO -->
<div id="stage">
    <div id="grid"></div>
</div>

<script>

let videos = JSON.parse(localStorage.getItem("videos") || "[]");
let dragIndex = null;

/* =========================
   ID YOUTUBE
========================= */

function extractID(url){
    if(!url) return null;
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* =========================
   LAYOUT INTELIGENTE
========================= */

function getCols(n){
    if(n === 1) return 1;
    if(n === 2) return 2;
    if(n === 3) return 2;
    if(n === 4) return 2;
    if(n === 5) return 3;
    return 3;
}

function getRows(n){
    if(n <= 2) return 1;
    if(n <= 4) return 2;
    return 2;
}

function applyLayout(n){

    let grid = document.getElementById("grid");

    grid.style.gridTemplateColumns = `repeat(${getCols(n)}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${getRows(n)}, 1fr)`;
}

/* =========================
   RENDER
========================= */

function load(){

    let grid = document.getElementById("grid");
    grid.innerHTML = "";

    let n = Math.min(videos.length, 6);

    applyLayout(n);

    for(let i=0;i<n;i++){

        let id = extractID(videos[i]);
        if(!id) continue;

        let tile = document.createElement("div");
        tile.className = "tile";

        tile.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen>
            </iframe>

            <button onclick="replace(${i})"
                style="
                position:absolute;
                bottom:5px;
                right:5px;
                z-index:5;
                font-size:10px;
                padding:4px 6px;
                background:#000000aa;
                color:white;
                border:1px solid #555;">
                TROCAR
            </button>
        `;

        grid.appendChild(tile);
    }
}

/* =========================
   SUBSTITUI LIVE
========================= */

function replace(index){

    let url = prompt("Cole nova live:");

    if(!url) return;

    videos[index] = url;

    localStorage.setItem("videos", JSON.stringify(videos));

    load();
}

/* =========================
   FULLSCREEN
========================= */

function toggleFS(){

    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen");
    }else{
        document.exitFullscreen();
        document.body.classList.remove("fullscreen");
    }
}

/* =========================
   START
========================= */

load();

</script>

</body>
</html>

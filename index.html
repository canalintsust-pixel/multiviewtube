<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiViewTube</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:15px;
}

textarea{
    width:100%;
    height:120px;
}

button{
    width:100%;
    height:50px;
    margin-top:10px;
}
</style>
</head>

<body>

<h2>MultiViewTube</h2>

<textarea id="links"
placeholder="Cole links (sem espaço também funciona)"></textarea>

<button onclick="go()">CARREGAR MOSAICO</button>

<script>

function go(){

    let raw = document.getElementById("links").value;
    raw = raw.replace(/\s/g,"");

    window.location.href =
        "mosaic.html?data=" + encodeURIComponent(raw);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MultiViewTube</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

#top{
    padding:10px;
    background:#1a1a1a;
    position:sticky;
    top:0;
}

textarea{
    width:100%;
    height:90px;
    border-radius:8px;
    border:none;
    padding:8px;
    font-size:14px;
}

button{
    width:100%;
    height:45px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    background:#ff0000;
    color:white;
    font-weight:bold;
}

#grid{
    display:grid;
    gap:6px;
    padding:6px;
}

.card{
    position:relative;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    aspect-ratio:16/9;
}

.name{
    position:absolute;
    top:5px;
    left:5px;
    background:rgba(0,0,0,0.6);
    padding:3px 6px;
    font-size:12px;
    z-index:2;
}

.controls{
    position:absolute;
    bottom:5px;
    right:5px;
    display:flex;
    gap:5px;
    z-index:2;
}

.controls button{
    width:auto;
    height:28px;
    font-size:11px;
    padding:2px 6px;
    background:#333;
    border-radius:5px;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div id="top">

<textarea id="links" placeholder="Cole links colados juntos (sem vírgula)"></textarea>

<button onclick="carregar()">CARREGAR MOSAICO</button>

<button onclick="toggleNames()">OCULTAR/NOMES FULLSCREEN</button>

</div>

<div id="grid"></div>

<script>

let nomesVisiveis = true;

function extrairID(url){
    let match = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return match ? match[2] : null;
}

function carregar(){

    let raw = document.getElementById("links").value.replace(/\s/g,"");

    let links = raw.split("https://").filter(Boolean)
                   .map(l=>"https://"+l)
                   .slice(0,8);

    let grid = document.getElementById("grid");
    grid.innerHTML="";

    let cols = links.length<=2 ? 2 : (links.length<=4 ? 2 : 4);

    grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;

    links.forEach((url,i)=>{

        let id = extrairID(url);

        let card = document.createElement("div");
        card.className="card";

        card.innerHTML = `
            <div class="name">Live ${i+1}</div>

            <div class="controls">
                <button onclick="mute(this)">🔇</button>
                <button onclick="fullscreen(this)">⛶</button>
            </div>

            <iframe
                src="https://www.youtube.com/embed/${id}?enablejsapi=1"
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>
        `;

        grid.appendChild(card);
    });
}

function mute(btn){
    alert("Mute depende da API do YouTube (próxima etapa avançada)");
}

function fullscreen(btn){

    let card = btn.closest(".card");

    if (!document.fullscreenElement) {
        card.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

function toggleNames(){

    nomesVisiveis = !nomesVisiveis;

    document.querySelectorAll(".name")
        .forEach(n=>{
            n.style.display = nomesVisiveis ? "block" : "none";
        });
}

</script>

</body>
</html>

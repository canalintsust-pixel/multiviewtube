<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>MultiViewTube</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
}

.container {
  padding: 16px;
}

h1 {
  font-size: 18px;
}

.channel {
  display: flex;
  align-items: center;
  padding: 10px;
  border-bottom: 1px solid #222;
}

.channel input {
  transform: scale(1.4);
  margin-right: 10px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  background: #e50914;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 8px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Selecione até 6 canais</h1>

  <div id="list"></div>

  <button onclick="openMosaic()">ABRIR MOSAICO</button>
</div>

<script>
const channels = [
  "@cnnbrasil",
  "@sbtnews",
  "@jovempannews",
  "@bandjornalismo",
  "@otimesbrasil",
  "@recordnews",
  "@sbtlive",
  "@metropolestv",
  "@sbtrj"
];

const list = document.getElementById("list");

channels.forEach(c => {
  const div = document.createElement("div");
  div.className = "channel";
  div.innerHTML = `
    <input type="checkbox" value="${c}" />
    <label>${c}</label>
  `;
  list.appendChild(div);
});

function openMosaic() {
  const selected = [...document.querySelectorAll("input:checked")]
    .map(i => i.value)
    .slice(0, 6);

  localStorage.setItem("channels", JSON.stringify(selected));
  window.location.href = "mosaic.html";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiViewTube</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    padding:10px;
}

textarea{
    width:100%;
    height:120px;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
}

button{
    width:100%;
    height:50px;
    margin-top:10px;
}
</style>
</head>

<body>

<h2>MultiViewTube</h2>

<textarea id="links" placeholder="cole links sem vírgula"></textarea>

<input id="names" placeholder="nomes separados por vírgula">

<button onclick="go()">CARREGAR MOSAICO</button>

<script>

function go(){

    let raw = document.getElementById("links").value;
    let names = document.getElementById("names").value.split(",");

    raw = raw.replace(/\s/g,"");
    let links = raw.split("https://").filter(Boolean);
    links = links.map(l=>"https://"+l);

    let data = links.map((u,i)=>({
        url:u,
        name:names[i] || ""
    }));

    localStorage.setItem("mv_data", JSON.stringify(data));

    window.location.href = "mosaic.html";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiViewTube</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

/* ÁREA FIXA DE CONTROLES */
#top{
    position:sticky;
    top:0;
    z-index:1000;
    background:#1a1a1a;
    padding:10px;
}

textarea{
    width:100%;
    height:80px;
    border-radius:8px;
    border:none;
    padding:8px;
}

button{
    width:100%;
    height:40px;
    margin-top:5px;
    border:none;
    border-radius:6px;
    background:#ff0000;
    color:white;
    font-weight:bold;
}

/* GRID DAS LIVES */
#grid{
    display:grid;
    gap:6px;
    padding:6px;
}

/* CARD */
.card{
    position:relative;
    background:black;
    border-radius:10px;
    overflow:hidden;
    aspect-ratio:16/9;
}

/* NOME */
.name{
    position:absolute;
    top:5px;
    left:5px;
    z-index:2;
    background:rgba(0,0,0,0.6);
    padding:3px 6px;
    font-size:12px;
}

/* INPUT DE NOME */
.name input{
    background:transparent;
    border:none;
    color:white;
    width:80px;
}

/* BOTÕES INTERNOS */
.controls{
    position:absolute;
    bottom:5px;
    right:5px;
    z-index:2;
    display:flex;
    gap:5px;
}

.controls button{
    width:auto;
    height:25px;
    font-size:11px;
    background:#333;
}

/* IFRAME */
iframe{
    width:100%;
    height:100%;
    border:none;
}

/* FULLSCREEN OVERLAY */
#fsOverlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:none;
    z-index:9999;
}

#fsGrid{
    width:100%;
    height:100%;
    display:grid;
}

#fsBar{
    position:absolute;
    top:0;
    width:100%;
    padding:10px;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:space-between;
}

</style>
</head>

<body>

<div id="top">

<textarea id="links" placeholder="Cole links juntos sem vírgula"></textarea>

<button onclick="carregar()">CARREGAR MOSAICO</button>
<button onclick="toggleNames()">OCULTAR/EXIBIR NOMES</button>
<button onclick="openFullScreen()">TELA CHEIA GERAL</button>

</div>

<div id="grid"></div>

<!-- FULLSCREEN MODE -->
<div id="fsOverlay">
    <div id="fsBar">
        <button onclick="closeFS()">SAIR</button>
    </div>
    <div id="fsGrid"></div>
</div>

<script>

let nomesVisiveis = true;
let currentLinks = [];

function extrairID(url){
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* ---------------- CARREGAR ---------------- */
function carregar(){

    let raw = document.getElementById("links").value.replace(/\s/g,"");

    let links = raw.split("https://").filter(Boolean)
                   .map(l=>"https://"+l)
                   .slice(0,8);

    currentLinks = links;

    let grid = document.getElementById("grid");
    grid.innerHTML="";

    let cols = links.length<=2 ? 2 : (links.length<=4 ? 2 : 4);

    grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;

    links.forEach((url,i)=>{

        let id = extrairID(url);

        let card = document.createElement("div");
        card.className="card";

        card.innerHTML = `
            <div class="name">
                <input value="Live ${i+1}" onchange="rename(this)">
            </div>

            <iframe src="https://www.youtube.com/embed/${id}?enablejsapi=1"
            allowfullscreen></iframe>
        `;

        grid.appendChild(card);
    });
}

/* ---------------- NOME ---------------- */
function rename(input){
    input.parentElement.innerHTML =
        `<input value="${input.value}" onchange="rename(this)">`;
}

/* ---------------- OCULTAR NOMES ---------------- */
function toggleNames(){
    nomesVisiveis = !nomesVisiveis;

    document.querySelectorAll(".name")
        .forEach(n=>{
            n.style.display = nomesVisiveis ? "block" : "none";
        });
}

/* ---------------- FULLSCREEN GERAL ---------------- */
function openFullScreen(){

    let fs = document.getElementById("fsOverlay");
    let grid = document.getElementById("grid");
    let fsGrid = document.getElementById("fsGrid");

    fsGrid.innerHTML = grid.innerHTML;

    fs.style.display="block";

    document.getElementById("fsBar").style.display="flex";
}

function closeFS(){
    document.getElementById("fsOverlay").style.display="none";
}

/* ---------------- TROCA DE POSIÇÃO (SIMPLES) ---------------- */
/* (versão leve: swap por clique duplo) */

let selected = null;

document.addEventListener("click", function(e){

    let card = e.target.closest(".card");

    if(!card) return;

    if(!selected){
        selected = card;
        card.style.border="2px solid red";
    } else {

        let temp = card.innerHTML;
        card.innerHTML = selected.innerHTML;
        selected.innerHTML = temp;

        selected.style.border="none";
        selected = null;
    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MultiviewTube</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: #fff;
}

header {
  padding: 16px;
  text-align: center;
  font-size: 20px;
  background: #111;
  border-bottom: 1px solid #222;
}

.container {
  padding: 16px;
  max-width: 900px;
  margin: 0 auto;
}

.channel {
  display: flex;
  align-items: center;
  padding: 10px;
  margin: 6px 0;
  background: #161616;
  border-radius: 8px;
  cursor: pointer;
}

.channel:hover {
  background: #1f1f1f;
}

.channel input {
  transform: scale(1.4);
  margin-right: 12px;
  pointer-events: none;
}

.footer {
  position: sticky;
  bottom: 0;
  background: #111;
  padding: 12px;
  border-top: 1px solid #222;
  display: flex;
  gap: 10px;
  justify-content: center;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

#openBtn {
  background: #ff0000;
  color: white;
}

#clearBtn {
  background: #333;
  color: white;
}

.counter {
  text-align: center;
  margin-top: 8px;
  color: #aaa;
  font-size: 13px;
}
</style>
</head>

<body>

<header>MultiviewTube</header>

<div class="container" id="channelList"></div>

<div class="counter" id="counter"></div>

<div class="footer">
  <button id="clearBtn">LIMPAR</button>
  <button id="openBtn">ABRIR MOSAICO</button>
</div>

<script>
const channels = [
  { name: "CNN Brasil", id: "@cnnbrasil" },
  { name: "SBT News", id: "@sbtnews" },
  { name: "Jovem Pan News", id: "@jovempannews" },
  { name: "Band Jornalismo", id: "@bandjornalismo" },
  { name: "Times Brasil", id: "@otimesbrasil" },
  { name: "Record News", id: "@recordnews" },
  { name: "SBT Live", id: "@sbtlive" },
  { name: "Metrópoles TV", id: "@metropolestv" },
  { name: "SBT RJ", id: "@sbtrj" }
];

const MAX = 6;

const listEl =
document.getElementById("channelList");

const counterEl =
document.getElementById("counter");

let selected =
JSON.parse(
localStorage.getItem("selectedChannels") || "[]"
);

/* =========================
   RENDER
========================= */

function render(){

  listEl.innerHTML = "";

  channels.forEach(ch => {

    const div =
    document.createElement("div");

    div.className = "channel";

    const checked =
    selected.includes(ch.id);

    div.innerHTML = `
      <input type="checkbox" ${checked ? "checked" : ""}/>
      <span>${ch.name}</span>
    `;

    div.onclick = () => toggleChannel(ch.id);

    listEl.appendChild(div);

  });

  updateCounter();

}

/* =========================
   TOGGLE
========================= */

function toggleChannel(id){

  const index =
  selected.indexOf(id);

  if(index >= 0){

    selected.splice(index,1);

  } else {

    if(selected.length >= MAX){
      return;
    }

    selected.push(id);

  }

  sync();

}

/* =========================
   SYNC STATE
========================= */

function sync(){

  localStorage.setItem(
    "selectedChannels",
    JSON.stringify(selected)
  );

  updateCounter();

  render();

}

/* =========================
   COUNTER
========================= */

function updateCounter(){

  counterEl.textContent =
  `${selected.length} / ${MAX} selecionados`;

}

/* =========================
   LIMPAR
========================= */

document.getElementById("clearBtn")
.onclick = () => {

  selected = [];

  localStorage.removeItem("selectedChannels");

  sync();

};

/* =========================
   ABRIR MOSAICO (CORRIGIDO)
========================= */

document.getElementById("openBtn")
.onclick = () => {

  if(selected.length === 0){
    return;
  }

  // 🔥 ISSO CORRIGE O BUG PRINCIPAL
  localStorage.removeItem("mosaicState");

  localStorage.setItem(
    "selectedChannels",
    JSON.stringify(selected)
  );

  window.location.href =
  "mosaic.html";

};

render();
</script>

</body>
</html>

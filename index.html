<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MultiViewTube</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

#top{
    padding:10px;
    background:#1a1a1a;
    position:sticky;
    top:0;
}

textarea{
    width:100%;
    height:80px;
    border-radius:8px;
    padding:8px;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    background:#ff0000;
    color:white;
    font-weight:bold;
}

#grid{
    display:grid;
    gap:6px;
    padding:6px;
}

.card{
    position:relative;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    height:220px;
}

.name{
    position:absolute;
    top:5px;
    left:5px;
    background:rgba(0,0,0,0.6);
    padding:3px 6px;
    font-size:12px;
    z-index:10;
}

.controls{
    position:absolute;
    bottom:5px;
    left:5px;
    z-index:10;
}

.controls button{
    width:auto;
    padding:4px 6px;
    font-size:11px;
    margin-right:3px;
    border-radius:4px;
}
</style>

</head>

<body>

<div id="top">

<textarea id="links"
placeholder="Cole links colados sem espaço ou com vários links"></textarea>

<button onclick="carregar()">CARREGAR MOSAICO</button>

<button onclick="toggleNames()">OCULTAR/NOMES</button>

</div>

<div id="grid"></div>

<script>

let players = [];
let showNames = true;

function extrairID(url){
    let match = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return match ? match[2] : null;
}

function carregar(){

    let raw = document.getElementById("links").value.replace(/\s/g,"");

    let links = raw.split("https://").filter(Boolean).map(l=>"https://"+l);

    links = links.slice(0,8);

    let cols = links.length <= 2 ? 2 : (links.length <= 4 ? 2 : 4);

    let grid = document.getElementById("grid");
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;

    players = [];

    links.forEach((url,i)=>{

        let id = extrairID(url);

        let card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="name" id="name-${i}">Live ${i+1}</div>

            <iframe
                width="100%"
                height="100%"
                src="https://www.youtube.com/embed/${id}"
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>

            <div class="controls">
                <button onclick="mute(${i})">🔇</button>
                <button onclick="fullscreen(${i})">⛶</button>
            </div>
        `;

        grid.appendChild(card);

        players.push(card);
    });
}

function mute(i){
    alert("Mute ainda será ligado via API do YouTube (próxima etapa)");
}

function fullscreen(i){
    players[i].requestFullscreen();
}

function toggleNames(){

    showNames = !showNames;

    players.forEach((p,i)=>{
        let el = document.getElementById("name-"+i);
        if(el) el.style.display = showNames ? "block" : "none";
    });
}

</script>

</body>
</html>

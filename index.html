<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiViewTube</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

/* TELA CONFIG */
#config{
    padding:10px;
    height:100vh;
    display:flex;
    flex-direction:column;
}

textarea{
    flex:1;
    resize:none;
    border-radius:10px;
    border:none;
    padding:10px;
}

button{
    height:45px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#ff0000;
    color:white;
    font-weight:bold;
}

/* TELA MOSAICO */
#app{
    display:none;
    height:100vh;
    position:relative;
}

#grid{
    display:grid;
    gap:5px;
    width:100%;
    height:100%;
    padding:5px;
}

/* CARD */
.card{
    position:relative;
    background:black;
    aspect-ratio:16/9;
    overflow:hidden;
}

.card iframe{
    width:100%;
    height:100%;
    border:none;
}

/* NOMES */
.name{
    position:absolute;
    top:5px;
    left:5px;
    background:rgba(0,0,0,0.6);
    padding:3px 6px;
    font-size:12px;
}

/* CONTROLES GLOBAIS */
#controls{
    position:absolute;
    top:10px;
    right:10px;
    z-index:10;
    display:flex;
    gap:5px;
}

.ctrl-btn{
    background:#222;
    border:none;
    color:white;
    padding:6px 8px;
    border-radius:6px;
    font-size:12px;
}

/* FULLSCREEN MODE */
.fullscreenMode #controls{
    opacity:0;
}

.fullscreenMode.showControls #controls{
    opacity:1;
}
</style>
</head>

<body>

<!-- CONFIG -->
<div id="config">

<textarea id="links" placeholder="Cole links colados juntos"></textarea>

<button onclick="carregar()">CARREGAR MOSAICO</button>

</div>

<!-- MOSAICO -->
<div id="app">

<div id="controls">
    <button class="ctrl-btn" onclick="toggleNames()">👁 Nomes</button>
    <button class="ctrl-btn" onclick="fullscreenAll()">⛶ Full</button>
    <button class="ctrl-btn" onclick="back()">↩</button>
</div>

<div id="grid"></div>

</div>

<script>

let nomesVisiveis = true;

function extrairID(url){
    let m = url.match(/(v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]+)/);
    return m ? m[2] : null;
}

/* ENTRAR MOSAICO */
function carregar(){

    let raw = document.getElementById("links").value.replace(/\s/g,"");

    let links = raw.split("https://")
        .filter(Boolean)
        .map(l=>"https://"+l)
        .slice(0,8);

    document.getElementById("config").style.display="none";
    document.getElementById("app").style.display="block";

    let grid = document.getElementById("grid");
    grid.innerHTML="";

    let cols = links.length<=2 ? 2 : (links.length<=4 ? 2 : 4);

    grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;

    links.forEach((url,i)=>{

        let id = extrairID(url);

        let card = document.createElement("div");
        card.className="card";

        card.innerHTML = `
            <div class="name">Live ${i+1}</div>

            <iframe
                src="https://www.youtube.com/embed/${id}?autoplay=1&mute=0"
                allowfullscreen>
            </iframe>
        `;

        grid.appendChild(card);
    });
}

/* VOLTAR */
function back(){
    document.getElementById("config").style.display="flex";
    document.getElementById("app").style.display="none";
}

/* FULLSCREEN GERAL */
function fullscreenAll(){

    let app = document.getElementById("app");

    if (!document.fullscreenElement) {
        app.requestFullscreen();
        document.body.classList.add("fullscreenMode");
    } else {
        document.exitFullscreen();
        document.body.classList.remove("fullscreenMode");
    }
}

/* MOSTRAR / OCULTAR NOMES */
function toggleNames(){

    nomesVisiveis = !nomesVisiveis;

    document.querySelectorAll(".name")
        .forEach(n=>{
            n.style.display = nomesVisiveis ? "block" : "none";
        });
}

/* MOSTRAR CONTROLES NO TOUCH (FULLSCREEN) */
document.addEventListener("touchstart", ()=>{
    document.body.classList.toggle("showControls");
});

</script>

</body>
</html>
